[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosiform"
version = "0.10.0"
description = "A deterministic compiler for instruction sets written as linked Markdown"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py==4.2.0",
]

[project.scripts]
prosiform = "prosiform.cli:main"

[project.urls]
Homepage = "https://github.com/m2ux/prosiform"

[tool.hatch.build.targets.wheel]
packages = ["prosiform"]

[tool.hatch.build.targets.wheel.force-include]
"../docs/glossary.md" = "prosiform/docs/glossary.md"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]

[tool.ruff.lint.isort]
# The package is named rather than inferred. Inference reads `src` relative to
# the directory ruff is invoked from, so the same file sorts one way from the
# repository root and another from this one.
known-first-party = ["prosiform"]

[tool.mypy]
python_version = "3.13"
strict = true
