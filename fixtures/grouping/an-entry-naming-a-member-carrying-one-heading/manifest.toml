description = "An entry reference naming a member whose whole content is the one heading its overview subsection absorbs resolves to that subsection, and the run succeeds. The member carries nothing above or at the grouping depth beside that heading, so the subsection is the whole of what the group emits from it."

clauses = [
  "Grouping — Document content above the grouping depth",
  "Bundle destinations — Document destinations",
  "Entry line — Link text",
]

[invocation]
cwd = "source"
arguments = ["notes/bare.md", "notes/kept.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Bare"
resolved = "bare"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Kept"
resolved = "kept"
