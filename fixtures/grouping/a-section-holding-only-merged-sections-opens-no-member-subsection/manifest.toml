description = "A selected section above the grouping depth whose body is wholly its sections at that depth contributes those sections to the merge and no member-overview content, so the group emits no Overview and no member subsection for that member. A reference to the section resolves to the first merged heading it holds."

clauses = [
  "Grouping — Document content above the grouping depth",
  "Grouping — A heading for every member",
  "Grouping — Merged section references",
]

