description = "A whole-document reference to a member carrying content above the grouping depth resolves to that member's overview subsection, which is named by the run of the document's path that tells it apart from the other members, here its stem alone. A member carrying nothing above that depth, and no title for that heading to absorb, is given no subsection, and a whole-document reference to it resolves to the merged heading it contributes, which no other member of the group carries."

clauses = [
  "Grouping — Document content above the grouping depth",
  "Bundle destinations — Document destinations",
]

[invocation]
root = "source"
arguments = ["-g", "notes:2", "entry.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Entry"
resolved = "entry"
