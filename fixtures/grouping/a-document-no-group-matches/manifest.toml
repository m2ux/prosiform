description = "A document without conversion metadata keeps its own file group, headed by its root-relative path, beside the explicitly declared merged group. One bundle therefore carries both arrangements, and the groups are ordered by root-relative path with the merged one taking the first of its members'."

clauses = [
  "Grouping — Group membership",
  "Input and output contract — Dependency order",
  "Grouping — Group naming",
  "Post-compilation invariants — Group isolation",
]

[invocation]
root = "source"
arguments = ["entry.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Entry"
resolved = "entry"
