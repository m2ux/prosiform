description = "Every contributing member takes its group-wide name and a distinct whole-document destination, with its content under that heading."

clauses = [
  "Grouping — Document-keyed sections",
  "Grouping — Variants by document",
  "Grouping — A heading for every member",
  "Grouping — Document content above the grouping depth",
  "Bundle destinations — Document destinations",
]

[invocation]
cwd = "source"
arguments = ["g/a/notes.md", "g/b/notes.md", "g/c/other.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Alone"
resolved = "alone"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "B Notes"
resolved = "b-notes"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "C Other"
resolved = "c-other"
