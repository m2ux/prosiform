description = "One selection bundles to groups in root-relative path order, each group carrying its content in source order, whichever order the entry references were written in."

clauses = [
  "Input and output contract — Groups, headed by its normalized root-relative path",
  "File-scoped hierarchy — Source order",
  "Compile before publishing — step 5, assign each emitted heading its destination in bundle order",
]

[invocation]
root = "source"
arguments = ["alpha.md", "middle.md#one", "middle.md#two"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "alpha"
resolved = "alpha"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "One"
resolved = "one"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Two"
resolved = "two"
