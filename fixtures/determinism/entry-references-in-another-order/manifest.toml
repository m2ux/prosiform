description = "The same selection written in another entry argument order bundles to the same bytes, so the arrangement follows the sources rather than the command line."

clauses = [
  "Input and output contract — Groups, headed by its normalized root-relative path",
  "File-scoped hierarchy — Source order",
  "Adversarial acceptance fixtures — Coverage, different entry argument orders",
]

[invocation]
cwd = "source"
arguments = ["middle.md#two", "alpha.md", "middle.md#one"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "One"
resolved = "one"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Two"
resolved = "two"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Alpha"
resolved = "alpha"
