description = "A link whose text opens with the dispatch operator names a remote address, which no local path holds, so it withholds no compilation and is refused with a diagnostic naming the reference and where it is written; no bundle is published."

clauses = [
  "Link classification and resource handling — An operator's target",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
reference = "https://example.test/spec.md"
source = "guide.md:6"
chain = ["guide.md", "https://example.test/spec.md"]
