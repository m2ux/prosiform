description = "Two contributing sources declaring different prosiform.dispatch texts fail with E_INVALID_CONVERSION_METADATA naming both locations and publish nothing, because an opening line whose wording depended on which source was read first would make the instruction a property of traversal order."

clauses = [
  "Conversion metadata — prosiform.dispatch",
  "Metadata failures",
  "Conversion metadata — Source ownership",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_CONVERSION_METADATA"
message_contains = ["prosiform.dispatch"]
