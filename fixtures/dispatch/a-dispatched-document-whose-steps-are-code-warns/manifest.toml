description = "A dispatched document whose only numbered list sits in a code block carries no step, because a list in a code block is an example of one, so the bundle publishes and the run warns."

clauses = [
  "Link classification and resource handling — Dispatched procedures",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_NOT_PROCEDURAL"
reference = "example.md"
resolved = "example.md"
chain = ["guide.md", "example.md"]
