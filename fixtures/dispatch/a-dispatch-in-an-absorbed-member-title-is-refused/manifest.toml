description = "A merged group's member whose title its subsection absorbs is emitted as that subsection rather than as a section, so a dispatch the title writes has no section to stand beneath; the run publishes nothing and fails, naming the link and the chain that reached the member."

clauses = [
  "Presets — default always applies",
  "Link classification and resource handling — Dispatch sub-sections",
  "Adversarial acceptance fixtures — Dispatch",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["⇉ Publish"]
reference = "publish.md"
source = "checklist-⇉-publish.md:8"
chain = ["guide.md", "checklist-⇉-publish.md"]
