description = "A merged group's member whose title its subsection absorbs is emitted as that subsection's heading text alone, so a dispatch the title writes is no link in the bundle; the run publishes nothing and fails, naming the link and the chain that reached the member."

clauses = [
  "Presets — default always applies",
  "Link classification and resource handling — Dispatch links",
  "Adversarial acceptance fixtures — Dispatch",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["⇉ Publish", "emitted as text alone"]
reference = "publish.md"
source = "checklist-⇉-publish.md:7"
chain = ["guide.md", "checklist-⇉-publish.md"]
