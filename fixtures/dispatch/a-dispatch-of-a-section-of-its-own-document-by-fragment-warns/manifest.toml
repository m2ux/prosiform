description = "A dispatched link naming a section of the document that writes it by fragment alone hands a sub-agent material its own document carries; the section's bundle dispatches nothing, so no cycle closes, both bundles publish and the run warns, naming the link and the section."

clauses = [
  "Link classification and resource handling — Dispatching its own document",
  "Link classification and resource handling — Fragment-only links",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md", "expected/guide__steps.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_SELF"
reference = "#steps"
resolved = "guide.md#steps"
