description = "A Mermaid click on a node whose text writes the dispatch mark directly against text opens no operator, as the same mark opening a link's text does: the target is bundled as an ordinary link's is, with no diagnostic, and the node text is carried as written."

clauses = [
  "Link classification and resource handling — Examples",
  "Link classification and resource handling — The dispatch operator",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
