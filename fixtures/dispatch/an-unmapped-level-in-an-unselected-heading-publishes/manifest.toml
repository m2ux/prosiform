description = "A dispatch link in a heading outside the selection publishes no dispatch, so its target's level is never resolved: the run publishes though the level the link selects has no model, and the selected dispatch carries its own."

clauses = [
  "Link classification and resource handling — Dispatch models",
  "Presets — A preset nothing selected warns",
]

[invocation]
cwd = "source"
arguments = ["guide.md#work"]

[expected]
exit_status = 0
bundles = [
  "expected/decide.bundle.md",
  "expected/guide__work.bundle.md",
]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "decide.md"
message_contains = ["the preset 'deep'"]
