description = "A Mermaid click whose tooltip is the dispatch mark names a document whose frontmatter declares no prosiform, so the operator states no compilation the run can carry out: the run refuses the click, naming it by its keyword and node, and publishes no bundle."

clauses = [
  "Link classification and resource handling — Examples",
  "Link classification and resource handling — An operator's target",
]

