description = "A chain of dispatches returning to a target already on it is a cycle whose sub-agents would dispatch one another without end, so the bundle publishes and the run warns, naming the chain up to the hop that returns."

clauses = [
  "Link classification and resource handling — Dispatch cycles",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_CYCLE"
reference = "plan.md"
chain = ["guide.md", "plan.md", "review.md", "plan.md"]
