description = "A link whose text opens with both the deferral mark and the dispatch mark is refused with a diagnostic naming the link, because each operator states how one compilation is carried out, so a link stating two states two contradictory things."

clauses = [
  "Link classification and resource handling — One operator per link",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["one compilation"]
reference = "¬ ⇉ the shared rules"
source = "guide.md:3"
chain = ["guide.md", "rules.md"]
