description = "A chain reaching a fourth dispatch is deeper than a chain is held to, so every bundle of the chain publishes and the run warns, naming the chain from the entry's own dispatch to the fourth hop."

clauses = [
  "Link classification and resource handling — Dispatch depth",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md", "expected/plan.bundle.md", "expected/publish.bundle.md", "expected/record.bundle.md", "expected/review.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_DEPTH"
reference = "plan.md"
chain = ["guide.md", "plan.md", "review.md", "record.md", "publish.md"]
