description = "A later incoming tag activates a substitution on a dispatched link. The run publishes only the entry and effective new target, with the final dispatch destination and no warning for the route; the transient old target produces no bundle."

clauses = ["Link classification and resource handling — Dispatched bundles", "Link classification and resource handling — Dispatch links", "Presets — Selection by tags", "Presets — One document under several selections"]

[invocation]
cwd = "source"
arguments = ["entry.md"]

