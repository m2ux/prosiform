description = "A dispatched link naming a section of the document that writes it through that document's own path is the same dispatch as one naming the section by fragment alone, so the bundle publishes and the run warns."

clauses = [
  "Link classification and resource handling — Dispatching its own document",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_SELF"
reference = "guide.md#steps"
resolved = "guide.md#steps"
