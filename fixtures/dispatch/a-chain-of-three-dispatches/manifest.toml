description = "A chain of three dispatches — the entry dispatching a target whose bundle dispatches, whose bundle dispatches once more — publishes one bundle for the entry and one for each target, each dispatch linking its target's bundle file, and is as deep as a chain is held to, so the run raises no warning."

clauses = [
  "Link classification and resource handling — Dispatched bundles",
  "Link classification and resource handling — Dispatch links",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md", "expected/plan.bundle.md", "expected/record.bundle.md", "expected/review.bundle.md"]
diagnostics = []
