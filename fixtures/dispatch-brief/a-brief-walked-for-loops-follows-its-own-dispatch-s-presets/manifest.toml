description = "A dispatch selecting inv.md's task preset, which redirects safe.md to loop.md, carries the brief whose dispatch reaches loop.md, and loop.md's brief dispatches inv.md with no preset. The untagged brief copy follows its own dispatch's presets, so its dispatch names safe.md and closes no loop: the run publishes every brief nested in turn and warns that the chain reaches a fourth dispatch."

clauses = [
  "Link classification and resource handling — Dispatch briefs",
  "Link classification and resource handling — Dispatch depth",
  "Section composition — Presets and subst",
  "Adversarial acceptance fixtures — Dispatch briefs",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = [
  "expected/guide.bundle.md",
  "expected/inv--p-9aae63ebb719.bundle.md",
  "expected/inv.bundle.md",
  "expected/loop.bundle.md",
  "expected/safe.bundle.md",
]

[[expected.diagnostics]]
severity = "warning"
code = "W_DISPATCH_DEPTH"
reference = "inv.md"
chain = ["guide.md", "inv.md", "loop.md", "inv.md", "safe.md"]
