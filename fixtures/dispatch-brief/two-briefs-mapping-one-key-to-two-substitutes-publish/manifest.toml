description = "One briefed target is dispatched twice, by links selecting its first and second presets, which map rules.md to two different substitutes. Each brief copy resolves under its own dispatch's presets alone, so both publish, each with its own substitute beside it, each dispatched bundle under its own presets, and neither route raises a warning."

clauses = [
  "Link classification and resource handling — Dispatch briefs",
  "Section composition — Presets and subst",
  "Adversarial acceptance fixtures — Dispatch briefs",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = [
  "expected/guide.bundle.md",
  "expected/investigate-first.bundle.md",
  "expected/investigate-second.bundle.md",
]
diagnostics = []
