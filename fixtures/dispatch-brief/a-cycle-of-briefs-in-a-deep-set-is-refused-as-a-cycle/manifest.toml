description = "A set in a level-6 section holds a member whose brief dispatches a target whose brief dispatches it back, so the loop is found on the set's members before the set's sub-section is fitted to a level; the run fails with E_DISPATCH_CYCLE naming the chain and the dispatch closing it, and publishes nothing."

clauses = [
  "Link classification and resource handling — Dispatch briefs",
  "Link classification and resource handling — Dispatch cycles",
  "Adversarial acceptance fixtures — Dispatch briefs",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_DISPATCH_CYCLE"
reference = "a.md"
chain = ["guide.md", "a.md", "b.md", "a.md"]

[expected.diagnostics.location]
file = "b.md"
line = 10
column = 1
