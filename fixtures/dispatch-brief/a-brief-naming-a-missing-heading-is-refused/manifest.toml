description = "A preset's brief names a heading its document does not carry, so the dispatch carrying it reaches no section; the run fails with E_TARGET_NOT_FOUND naming the brief and the route through the dispatch, and publishes nothing."

clauses = [
  "Link classification and resource handling — Dispatch briefs",
  "Conversion metadata — brief names a section of its own document",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_TARGET_NOT_FOUND"
reference = "investigate.md#missing"
resolved = "investigate.md"
source = "guide.md:8"
chain = ["guide.md", "investigate.md#missing"]
