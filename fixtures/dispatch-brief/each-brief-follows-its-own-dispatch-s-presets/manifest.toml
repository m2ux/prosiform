description = "One target is dispatched twice: once by a link whose title selects investigate.md's task preset, which redirects rules.md to task-rules.md, and once by a link selecting none, each carrying the default brief. Each brief copy follows its own dispatch's presets: the tagged copy's link points at the task rules and the untagged copy's at the rules, both bundled beside the briefs, and each dispatched bundle carries the section under its own presets. The task route raises nothing."

clauses = [
  "Link classification and resource handling — Dispatch briefs",
  "Section composition — Presets and subst",
  "Presets — What a selection governs",
  "Adversarial acceptance fixtures — Dispatch briefs",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = [
  "expected/guide.bundle.md",
  "expected/investigate-task.bundle.md",
  "expected/investigate.bundle.md",
]
diagnostics = []
