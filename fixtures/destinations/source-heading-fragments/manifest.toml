description = "Each source heading takes the fragment a renderer generates for it — punctuation discarded, inline markup read through, text outside ASCII lowered and kept, and a repeated heading numbered apart — each observed as the destination a later file group takes behind it."

clauses = [
  "Source-heading resolution — derive visible heading text from parser events",
  "Source-heading resolution — GitHub-compatible slugs and duplicate tracking",
  "Bundle destinations — Ordinal assignment",
  "Entry line",
]

[invocation]
root = "source"
arguments = [
  "article.md",
  "café-münster.md",
  "notes.md",
  "the-code-span-and-bold-text.md",
  "whats-new-v10.md",
]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "article"
destination = "article"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "caf\u00e9-m\u00fcnster"
destination = "caf\u00e9-m\u00fcnster-1"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "notes"
destination = "notes-2"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "the-code-span-and-bold-text"
destination = "the-code-span-and-bold-text-1"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "whats-new-v10"
destination = "whats-new-v10-1"
