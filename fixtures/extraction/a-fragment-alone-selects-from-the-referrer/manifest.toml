description = "A fragment-only entry reference selects the section it names from the document --from names, and the group the bundle carries is that document."

clauses = [
  "CLI contract — --from DOC, a referring document supplies context for a bare fragment",
  "Reference normalization and path identity, a fragment-only command-line reference requires --from",
  "Section extraction and output hierarchy",
]

[invocation]
root = "source"
arguments = ["--from", "guide.md", "#stop"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Stop"
resolved = "stop"
