description = "A link from the content above a document's first eligible heading to that whole document resolves to the document's own destination, because a preamble belongs to the document node the reference names and that node is in the bundle."

clauses = [
  "Self-reference and ancestor-reference behavior — Preamble ownership",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "guide"
resolved = "guide"
