description = "A marked link from the content above a document's first eligible heading to that whole document fails as a direct self-reference, because a preamble belongs to the document node the reference names."

clauses = [
  "Self-reference and ancestor-reference behavior — Preamble ownership",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_SELF_REFERENCE"
reference = "guide.md"
resolved = "guide.md"
source = "guide.md:1"
chain = ["guide.md", "guide.md"]
