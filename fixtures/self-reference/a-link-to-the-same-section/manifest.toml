description = "A link from a section to that same canonical section resolves to the section's own destination, because the content is in the bundle either way and the link names a place that exists."

clauses = [
  "Self-reference and ancestor-reference behavior — Direct self-reference",
]

[invocation]
root = "source"
arguments = ["guide.md#alpha"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Alpha"
resolved = "alpha"
