description = "A run-set target holding a paragraph above its bulleted list is no run-set, so the bundle publishes with the target compiled and the run warns, naming the link, where it is written and the target."

clauses = [
  "Link classification and resource handling — Run-set shape",
  "Adversarial acceptance fixtures — Run-set",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_RUN_SET_SHAPE"
reference = "plan.md#reviews"
resolved = "plan.md#reviews"
chain = ["guide.md", "plan.md#reviews"]
