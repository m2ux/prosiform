description = "An output path naming a document the run reads is refused as invalid usage, so a run never publishes over its own source."

clauses = [
  "CLI contract — -o FILE, a path naming an input source is refused",
  "CLI contract, a command line the grammar does not admit",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
  "CLI contract, one code for the form of the command line, and the message says which fault it was",
]

[invocation]
cwd = "source"
arguments = ["-o", "guide.md", "guide.md"]

[expected]
exit_status = 2
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["guide.md"]
