description = "A command line holding no argument prints the guide: how to run pf, what a ↳ link, a ⇉ link and a ⫽ dispatch set mean, the inputs a dispatch carries, that failures return together, and how a sub-agent's question is answered. The wording around them is the build's own, so the response is stated as the text it carries rather than as bytes, and the run writes no bundle."

clauses = [
  "Guide",
  "Exit status and JSON diagnostics — 0, successful compilation, validation, or informational CLI response",
]

[invocation]
cwd = "source"
arguments = []

[expected]
exit_status = 0
stdout_contains = [
  "pf -o <folder> <document>[#<section>]",
  "-o <folder>      folder the run's bundles are written into",
  "#<section>       one section of it, named by the slug of its heading",
  "<document>       a document named from the working directory",
  "1  a failure stopped the run: report its diagnostics and go no further",
  "2  invalid usage: this command spec is not one pf accepts",
  "↳  names a section to inline",
  "keep it in context",
  "⇉  names a bundle to hand on",
  "⫽  marks a dispatch set",
  "the section it heads is no step of the workflow",
  "written under the section its title names",
  "Give each bundle to its own sub-agent at once",
  "one per value where that step applies to several",
  "A failure cancels nothing; all failures return together.",
]
diagnostics = []
