description = "A command line holding no argument prints the guide: how to run pf on a link in a bundle as written or on a document path, what a ↳ link, a ⇉ link and a ⫽ dispatch set mean, that a ? among title tags is resolved with --pick, the inputs a dispatch carries, and that failures return together. The wording around them is the build's own, so the response is stated as the text it carries rather than as bytes, and the run writes no bundle."

clauses = [
  "Guide",
  "Exit status and JSON diagnostics — 0, successful compilation, validation, or informational CLI response",
]

[invocation]
cwd = "source"
arguments = []

[expected]
exit_status = 0
stdout_contains = [
  "pf -o <folder> '<link>' [--pick <alternative>]",
  "pf -o <folder> <document>[#<section>]",
  "-o <folder>            folder the run's bundles are written into, made if",
  "<link>                 a link as a bundle publishes it: a Markdown link,",
  "or a Mermaid click or class diagram link line",
  "<document>             one document, or document#section, named from the",
  "--pick <alternative>   the alternative a link whose title carries ?",
  "1  a failure stopped the run: report its diagnostics and go no further",
  "2  invalid usage or option combination",
  "Run pf on a link in a bundle as written, quoted as one argument, from",
  "the directory pf compiled that bundle in. When its title carries ?, add",
  "--pick naming the alternative that fits your task if you know it, or",
  "when pf lists the alternatives:",
  "↳  names a section to inline",
  "keep it in context",
  "⇉  names a bundle to hand on",
  "⫽  marks a dispatch set",
  "its section holds one set of bundles, listed as",
  "⇉ lines in the sub-section headed ⫽ Dispatch Set.",
  "Give each bundle to its own sub-agent at once",
  "step that led there, one per value where that step applies to",
  "A failure cancels nothing; all failures return together.",
  "?  among a link's title tags leaves the pick to you, made with --pick",
]
diagnostics = []
