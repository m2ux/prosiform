description = "A command line naming no allowed source root is refused as invalid usage, since nothing says which tree the run may read, and the message names the option that says it."

clauses = [
  "CLI contract — --root DIR, required allowed source root",
  "CLI contract, a missing --root",
  "CLI contract, a command line the grammar does not admit",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
  "CLI contract, one code for the form of the command line, and the message says which fault it was",
]

[invocation]
arguments = ["guide.md"]

[expected]
exit_status = 2
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["--root"]
