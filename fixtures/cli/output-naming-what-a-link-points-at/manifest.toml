description = "A source the run would reach through a symbolic link is refused by the no-symlink policy, so the output check never resolves a source path through a link: the bundle the run would write into the named folder is the file the link points at, and the run refuses the link rather than claiming identity with a file it does not read."

clauses = [
  "No-symlink source policy",
  "CLI contract — -o DIR, a bundle path naming any captured source is refused",
]

[invocation]
cwd = "source"
arguments = ["-o", "..", "alias.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_SOURCE_SYMLINK"
reference = "alias.md"
