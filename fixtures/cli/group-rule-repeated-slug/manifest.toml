description = "A slug named by two grouping rules is refused as an invalid option combination, since a rule is repeatable once per slug."

clauses = [
  "Grouping, a grouping rule refused for its repetition",
  "CLI contract — -g SLUG:DEPTH, repeatable, once per slug",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
root = "source"
arguments = ["-g", "docs:2", "-g", "docs:3", "guide.md"]

[expected]
exit_status = 2
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_GROUP_RULE"
