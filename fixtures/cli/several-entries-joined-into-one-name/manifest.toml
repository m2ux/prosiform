description = "One entry reaches all required input documents or sections through authored links. The bundle preserves their content, first-link order and source-owned grouping; the entry alone names the run folder and entry bundle."

clauses = [
  "Input and output contract — Entry references",
  "CLI contract — -o DIR, the invocation working directory when absent",
  "Exit status and JSON diagnostics — 0, successful compilation, validation, or informational CLI response",
]

[invocation]
cwd = "source"
arguments = ["--entry", "notes/rules.md"]

[expected]
exit_status = 0
bundles = ["expected/notes_rules.bundle.md"]
diagnostics = []
