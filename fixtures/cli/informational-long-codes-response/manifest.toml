description = "The code listing to the long option is the response to -C: every error and warning code the build can report, one per line, on standard output, and success."

clauses = [
  "CLI contract — -C, --codes, print every error and warning code the build can report",
  "Exit status and JSON diagnostics — 0, successful compilation, validation, or informational CLI response",
]

[invocation]
cwd = "source"
arguments = ["--codes"]

[expected]
exit_status = 0
stdout_contains = ["E_INVALID_USAGE\n", "E_PUBLICATION_FAILED\n", "W_SUBST_USED\n"]
diagnostics = []
