description = "The usage response to the long option is the response to -h: it shows the invocation the contract documents, a default an option carries and the meaning of each exit status, and the wording around them is the build's own, so the response is stated as the text it carries rather than as bytes."

clauses = [
  "CLI contract — -h, show usage, defaults, and exit-status meanings",
  "Exit status and JSON diagnostics — 0, successful compilation, validation, or informational CLI response",
]

[invocation]
cwd = "source"
arguments = ["--help"]

[expected]
exit_status = 0
stdout_contains = [
  "pf [OPTIONS] REF [REF ...]",
  "default 256",
  "compilation, validation, or informational",
  "dependency, policy, safety, or resource-limit failure",
  "usage or option combination",
  "publication or delivery failure",
  "unexpected internal error",
]
diagnostics = []
