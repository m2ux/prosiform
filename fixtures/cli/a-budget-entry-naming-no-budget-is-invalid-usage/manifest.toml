description = "A budget entry whose name is empty is refused as invalid usage, and the message names the entry."

clauses = [
  "Resource limits — Malformed entry, an empty name",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["--budget", "=1", "guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["'=1'", "names no budget"]
