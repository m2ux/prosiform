description = "A local Markdown reference naming a declaring document and a heading it does not carry fails with E_TARGET_NOT_FOUND and publishes nothing, so a reference the run is responsible for is one it must be able to follow the whole way."

clauses = [
  "Link classification and resource handling — A target that resolves to nothing",
  "Section extraction and output hierarchy, eligible roots",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_TARGET_NOT_FOUND"
reference = "procedure.md#review"
resolved = "procedure.md"
source = "guide.md:6"
chain = ["guide.md", "procedure.md#review"]
