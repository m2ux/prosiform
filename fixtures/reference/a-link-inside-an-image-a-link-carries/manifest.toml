description = "A link written inside an image an enclosing link carries resolves under the allowed source root like any other, so both links are bundled and rewritten to their targets' destinations and the run ends in no internal error."

clauses = [
  "Link classification and resource handling — Local Markdown document links",
  "Bundle destinations",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_RESOURCE_PORTABILITY"
