description = "A class diagram link line reads the label its class declares as its text, so a class labelled with the dispatch mark dispatches its destination, while a class declaring no label is drawn with its name, an identifier rather than text, and its link carries no operator: its target is bundled inline. Only the destinations are rewritten."

clauses = [
  "Link classification and resource handling — Examples",
  "Link classification and resource handling — Diagram link text",
  "Link classification and resource handling — Dispatched bundles",
  "Adversarial acceptance fixtures — Dispatch",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md", "expected/intake.bundle.md"]
diagnostics = []
