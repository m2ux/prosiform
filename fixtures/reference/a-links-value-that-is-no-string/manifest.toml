description = "A sequence diagram's links line holding a value that is no string, which a renderer draws as a link opening nothing, is refused with a diagnostic naming the line; no bundle is published."

clauses = [
  "Link classification and resource handling — Examples",
]

[invocation]
cwd = "source"
arguments = ["exchange.md"]

