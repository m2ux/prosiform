description = "A link written inside an image's alternative content resolves under the allowed source root like any other, so it is bundled and rewritten to its target's destination and no published bundle names a source path."

clauses = [
  "Link classification and resource handling — Local Markdown document links under the root",
  "Bundle destinations",
]

