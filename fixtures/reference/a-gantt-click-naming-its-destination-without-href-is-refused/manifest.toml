description = "A Gantt task's click naming its destination without href is refused with a diagnostic naming its line and the destination, since Mermaid's gantt grammar reads a click's destination only after href and draws no chart from the short form; no bundle is published."

clauses = [
  "Link classification and resource handling — Examples",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
reference = "freeze.md"
message_contains = ["click freeze", "href"]
source = "guide.md:12"
chain = ["guide.md"]
