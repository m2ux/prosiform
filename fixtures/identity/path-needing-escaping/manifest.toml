description = "A path whose punctuation spells a Markdown link is escaped as literal heading text, so the heading naming the file creates no link and the bundle gains no dependency the source never wrote."

clauses = [
  "File-scoped hierarchy — escape the path as literal heading text",
  "Bundle destinations — Document destinations",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["notes/[draft](page.md).md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "notes/[draft](page.md)"
resolved = "notesdraftpagemd"
