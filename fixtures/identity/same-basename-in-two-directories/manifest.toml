description = "Two sources sharing a basename in different directories stay distinguishable, each headed by its own root-relative path, and the groups are ordered by that path rather than by entry order."

clauses = [
  "File-scoped hierarchy, same basename in different directories",
  "Input and output contract — Dependency order",
  "File-scoped hierarchy — Absorbed title",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["notes/note.md", "docs/note.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Docs/Note"
resolved = "docsnote"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Notes/Note"
resolved = "notesnote"
