description = "A section selected first and its whole document included later by a dependency is one region: the document's group carries the larger region alone, and a reference in the part the entry did not select is resolved."

clauses = [
  "Compile before publishing, expanding coverage",
  "Compile before publishing — step 5, consolidate selections",
  "Input and output contract — Groups, emit each selected region once",
  "Adversarial acceptance fixtures — Wrapper identity",
  "Input and output contract — Entry identity",
]

[invocation]
root = "source"
arguments = ["guide.md#alpha"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Alpha"
resolved = "alpha"
