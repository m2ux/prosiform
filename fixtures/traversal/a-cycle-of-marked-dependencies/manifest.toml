description = "A reference graph whose marked dependencies form a cycle bundles to a fixed point: each reachable document is present once, in root-relative path order, and the traversal terminates on the identity each reference normalized to rather than on a depth it refuses at."

clauses = [
  "Compile before publishing — Expanding coverage",
  "Self-reference and ancestor-reference behavior — Shared dependency",
  "Link classification and resource handling — Marked local Markdown document links",
]

[invocation]
root = "source"
arguments = ["alpha.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "alpha"
destination = "alpha"
