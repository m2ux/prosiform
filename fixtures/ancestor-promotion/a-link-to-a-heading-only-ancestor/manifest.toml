description = "A marked link whose target is present only as a heading-only structural ancestor expands closure to that section's selected body, replacing the ancestor, while an ancestor no reference names keeps its heading and none of its body."

clauses = [
  "Heading-only structural ancestors — Targets",
  "Heading-only structural ancestors — Deduplication",
  "Adversarial acceptance fixtures — Partial outlines, ancestor promotion after dependency expansion",
]

[invocation]
root = "source"
arguments = ["guide.md#detail", "guide.md#gamma"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Detail"
resolved = "detail"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Gamma"
