description = "A run whose selected content carries more diagram click links than the link budget names fails, each click counted once where the source wrote it."

clauses = [
  "Resource limits — -L",
]

[invocation]
cwd = "source"
arguments = ["-L", "2", "guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
