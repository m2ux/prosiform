description = "A source whose raw bytes exceed the per-source budget fails the run, the figure counted over the bytes the file holds."

clauses = [
  "Resource limits — file-bytes",
]

[invocation]
cwd = "source"
arguments = ["--budget", "file-bytes=16", "alpha.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
