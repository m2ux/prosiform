description = "A run whose sources sum to more raw bytes than the input budget names fails at the source that crosses the sum, each source counted once."

clauses = [
  "Resource limits — -I",
]

[invocation]
root = "source"
arguments = ["-I", "60", "alpha.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
