description = "A source nesting container blocks deeper than the nesting budget names fails as the explicit refusal the contract declares, rather than being reinterpreted as the shallower syntax a parser ceiling would leave."

clauses = [
  "Resource limits — -N",
]

[invocation]
cwd = "source"
arguments = ["-N", "3", "guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
