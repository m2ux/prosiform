description = "A run opening more distinct source documents than the file budget names fails at the document that crosses it, with no bundle published."

clauses = [
  "Resource limits — --max-files",
]

[invocation]
root = "source"
arguments = ["--max-files", "2", "alpha.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
