description = "A line of three hyphens carrying trailing spaces opens no frontmatter, so the document is bundled whole and keeps those spaces."

clauses = [
  "Frontmatter policy, an indented delimiter, a trailing space, a TOML fence and a leading blank line are not v1 frontmatter",
  "Parser and source-preserving edits — Untouched content",
  "File-scoped hierarchy — Preamble",
  "Adversarial acceptance fixtures — Frontmatter, malformed delimiters",
]

