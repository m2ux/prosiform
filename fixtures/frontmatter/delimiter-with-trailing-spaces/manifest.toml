description = "A line of three hyphens carrying trailing spaces opens no frontmatter, so the prosiform key below it declares nothing and the entry naming the document fails with E_TARGET_NOT_FOUND."

clauses = [
  "Frontmatter policy, an indented delimiter, a trailing space, a TOML fence and a leading blank line are not v1 frontmatter",
  "Input and output contract — Entry references",
  "Adversarial acceptance fixtures — Frontmatter, malformed delimiters",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_TARGET_NOT_FOUND"
reference = "guide.md"
chain = ["guide.md"]
message_contains = ["declares no prosiform"]
