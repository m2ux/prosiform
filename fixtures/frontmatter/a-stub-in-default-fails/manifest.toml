description = "A stub in default fails with E_INVALID_CONVERSION_METADATA naming the field and publishes nothing, since default is in force wherever its document is bundled."

clauses = [
  "Conversion metadata — stub holds one line",
  "Metadata failures",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_CONVERSION_METADATA"
message_contains = ["prosiform.default.stub"]
reference = "guide.md"
chain = ["guide.md"]

[expected.diagnostics.location]
file = "guide.md"
line = 4
column = 5
