description = "A preset field the contract does not admit, here dispatch, fails with E_INVALID_CONVERSION_METADATA naming the key and publishes nothing."

clauses = [
  "Presets — default always applies",
  "Conversion metadata — The admitted keys",
  "Metadata failures",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_CONVERSION_METADATA"
message_contains = ["unknown field prosiform.default.dispatch"]
reference = "guide.md"
chain = ["guide.md"]
