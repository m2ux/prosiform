description = "A choice in default fails with E_INVALID_CONVERSION_METADATA naming the field and publishes nothing, since default is in force wherever its document is compiled."

clauses = [
  "Presets — default always applies",
  "Conversion metadata — The admitted keys",
  "Metadata failures",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_CONVERSION_METADATA"
message_contains = ["prosiform.default.choice"]
reference = "guide.md"
chain = ["guide.md"]

[expected.diagnostics.location]
file = "guide.md"
line = 4
column = 5
