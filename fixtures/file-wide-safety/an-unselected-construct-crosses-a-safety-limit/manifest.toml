description = "A construct in a section no reference selected, nesting containers deeper than the parsing-safety budget allows, fails the run as an inability to index the source that carries it rather than as a dependency on that section."

clauses = [
  "Validation scope, an opened file can fail because an unselected construct exceeds a declared file-wide parsing-safety limit",
  "Resource limits — --max-nesting",
  "Adversarial acceptance fixtures — File-wide safety, excessive parsing depth in an unselected sibling",
]

[invocation]
root = "source"
arguments = ["--max-nesting", "3", "guide.md#procedure"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
reference = "guide.md"
source = "guide.md"
chain = ["guide.md#procedure"]
