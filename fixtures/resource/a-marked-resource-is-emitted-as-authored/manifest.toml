description = "A marked link and a marked image, both naming a file under the allowed source root, are emitted with every byte their author wrote, because only a Markdown document is bundleable and nothing a resource reference carries asks for one."

clauses = [
  "Link classification and resource handling — Resources",
  "Resources are text",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_RESOURCE_PORTABILITY"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Guide"
resolved = "guide"
