description = "An image naming a declaring Markdown document is emitted as authored, the document it names is never bundled, and the run warns once that the bundle names a resource, because image syntax embeds rather than links and a document named that way is no more bundleable than a picture."

clauses = [
  "Link classification and resource handling — Resources",
  "Resources are text",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_RESOURCE_PORTABILITY"
