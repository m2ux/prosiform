description = "A diagram click naming a file under the allowed source root that is not a Markdown document is emitted as authored and never opened, and the bundle carrying it warns once that resource portability is not guaranteed, as one carrying an inline link to that file does."

clauses = [
  "Resources are text",
  "Link classification and resource handling — Everything else",
]

[invocation]
cwd = "source"
arguments = ["lifecycle.md"]

[expected]
exit_status = 0
bundles = ["expected/lifecycle.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_RESOURCE_PORTABILITY"
