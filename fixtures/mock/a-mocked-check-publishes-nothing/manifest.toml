description = "A stub's pair applies under -c, which publishes nothing and reports the substitution exactly as a publishing run does, because a check is how a trial is exercised in continuous integration and a stub that quietly stopped applying there would quieten every trial without failing one."

clauses = [
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
  "CLI contract — -c",
]

[invocation]
cwd = "source"
arguments = ["-c", "[Guide](guide.md \"mock\")"]

[expected]
exit_status = 0

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "rules.md"
resolved = "stand-in.md"

[expected.diagnostics.location]
file = "guide.md"
line = 6
column = 1
