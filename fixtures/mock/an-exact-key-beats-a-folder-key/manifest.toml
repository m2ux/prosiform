description = "A document key answers before a folder key holding the same reference, and of two folder keys holding one reference the longer answers, so the narrowest statement a caller wrote redirects each reference while the wider folder still serves everything else under it."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["-m", "rules/=stubs/", "-m", "rules/red.md=other.md", "-m", "rules/visual/=deepest/", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_MOCK_SUBSTITUTED"
source = "rules/red.md#checks"
resolved = "other.md#checks"

[expected.diagnostics.location]
file = "guide.md"
line = 3
column = 1

[[expected.diagnostics]]
severity = "warning"
code = "W_MOCK_SUBSTITUTED"
source = "rules/blue.md"
resolved = "stubs/blue.md"

[expected.diagnostics.location]
file = "guide.md"
line = 3
column = 1

[[expected.diagnostics]]
severity = "warning"
code = "W_MOCK_SUBSTITUTED"
source = "rules/visual/red.md"
resolved = "deepest/red.md"

[expected.diagnostics.location]
file = "guide.md"
line = 3
column = 1
