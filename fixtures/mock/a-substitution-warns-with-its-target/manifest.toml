description = "One key of a stub the entry declares, serving two references — the document whole and one of its sections — states one substitution, naming the first link that redirected it, its destination and the substitute, so a bundle of stand-in material cannot be read as a bundle of the material that ships."

clauses = [
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Guide](guide.md \"mock\")"]

[expected]
exit_status = 0
bundles = ["expected/guide-mock.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "rules.md"
resolved = "stand-in.md"
message_contains = ["rules.md"]

[expected.diagnostics.location]
file = "guide.md"
line = 6
column = 1
