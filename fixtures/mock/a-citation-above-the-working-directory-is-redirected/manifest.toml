description = "A citation above the working directory is redirected by a mapping key, so a reference the run would otherwise carry as text compiles the substitute and is rewritten to its destination, and the run states the substitution it performed."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Link classification and resource handling — The substitution mapping, both sides read from the working directory",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["-m", "../notes.md=../stand-in.md", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "../notes.md"
resolved = "../stand-in.md"

[expected.diagnostics.location]
file = "guide.md"
line = 6
column = 1
