description = "A citation above the working directory is redirected by a subst key, so a reference the run would otherwise carry as text compiles the substitute and is rewritten to its destination."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Link classification and resource handling — The substitution mapping, each side resolved from the directory of the declaring document",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
