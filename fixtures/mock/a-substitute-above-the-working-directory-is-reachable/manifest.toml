description = "A subst alternative carrying a parent segment, resolved from the declaring document, reaches a substitute beside the source tree and above the working directory the run reads from, and the run states the substitution it performed."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Link classification and resource handling — The substitution mapping, each side resolved from the directory of the declaring document",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "rules.md"
resolved = "../stand-in.md"

[expected.diagnostics.location]
file = "guide.md"
line = 7
column = 1
