description = "A mock value carrying a parent segment reaches a substitute beside the source tree, above the working directory the run reads from, which is what the parameter exists for, and the run states the substitution it performed."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Link classification and resource handling — The substitution mapping, both sides read from the working directory",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["-m", "rules.md=../stand-in.md", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "rules.md"
resolved = "../stand-in.md"

[expected.diagnostics.location]
file = "guide.md"
line = 7
column = 1
