description = "A substitute whose own path is another subst key is read from disk rather than redirected a second time, so the bundle carries it and the key naming it is reported unused, which is what makes the pairs a lookup table rather than a chain."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "a.md"
resolved = "b.md"

[expected.diagnostics.location]
file = "guide.md"
line = 6
column = 1

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_UNUSED"
source = "b.md"
