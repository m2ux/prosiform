description = "A deferred link's target is redirected like any other, so the destination the bundle publishes is the substitute's path from the folder the bundle is in, which is where a later run following that path from that folder finds the stand-in, and the document the link names is never opened or bundled."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Link classification and resource handling — A deferred link's destination",
  "Link classification and resource handling — A withheld link's target",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
