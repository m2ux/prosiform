description = "The entry names its recorded stub and reaches stage.md both by an ordinary link and by a dispatch, so the stub's pair redirects the review link in two bundles of the run, and the run warns W_SUBST_USED once for that pair."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Presets — Stubs",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry--p-d39dc21d.bundle.md", "expected/stage.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "review.md"
resolved = "recorded-review.md"

[expected.diagnostics.location]
file = "stage.md"
line = 8
column = 1
