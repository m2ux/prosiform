description = "The entry names recorded and reaches stage.md both by an ordinary link and by a dispatch, so the recorded stub's pair redirects the review link in two bundles of the run, and the run warns W_SUBST_USED once for that pair."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Presets — Stubs",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry.bundle.md", "expected/stage--p-d39dc21d7beb9d3b49138e616dc40270f2e7e38f8c4a1f06201d6e2a6cb1d52e.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "review.md"
resolved = "recorded-review.md"

[expected.diagnostics.location]
file = "stage.md"
line = 11
column = 1
