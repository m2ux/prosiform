description = "A source headed by a UTF-16 byte-order mark fails at its first byte, because the encoding the profile requires admits no such sequence and decoding it with replacements would publish characters the author never wrote."

clauses = [
  "Markdown and source-heading profile — Encoding, require valid UTF-8",
  "Validation and failure contract — Preservation",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_ENCODING"
reference = "guide.md"
source = "guide.md"
