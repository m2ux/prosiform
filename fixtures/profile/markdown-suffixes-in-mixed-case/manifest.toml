description = "Both Markdown suffixes are classified case-insensitively, while each document's file heading keeps the spelling and case the filesystem holds."

clauses = [
  "Markdown and source-heading profile — File suffixes",
  "File-scoped hierarchy — Absorbed title",
]

[invocation]
cwd = "source"
arguments = ["Guide.MD", "notes/Note.Markdown"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Guide"
resolved = "guide"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Notes/Note"
resolved = "notesnote"
