description = "A paragraph wrapped in <big><pre> and </pre></big> is a command block: the bundle emits its content, without the wrapper tags or the lines they stood alone on, with strong emphasis enclosing a link's whole text unwrapped and every character reference decoded, and the links inside it are followed and rewritten as any paragraph's are."

clauses = [
  "Markdown and source-heading profile — HTML, a command block is emitted as its content",
  "Validation and failure contract — Preservation, a compacted command block is held to what its source shows",
  "Bundle destinations — Internal links",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
