description = "A command-block wrapper carrying an attribute is raw HTML and fails, naming the line that carries it."

clauses = [
  "Markdown and source-heading profile — HTML, raw HTML in selected content fails",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_RAW_HTML"
source = "guide.md:8"
