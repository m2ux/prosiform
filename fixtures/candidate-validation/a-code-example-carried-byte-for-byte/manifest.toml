description = "A code example keeps its indentation, its runs of spaces, its trailing spaces and the blank line inside it, because untouched bytes are carried rather than reformatted."

clauses = [
  "Preservation — Untouched non-heading bytes and code examples are not reformatted or repaired",
  "Post-compilation invariants — Reference preservation",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "guide"
destination = "guide"
