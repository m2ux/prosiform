description = "A region carrying a rewritten link keeps every byte the rewrite does not reach: an indented thematic break keeps its indent and a line break keeps the two spaces that wrote it."

clauses = [
  "Validation and failure contract — Preservation, untouched non-heading bytes and code examples are not reformatted or repaired",
  "Post-compilation invariants — Reference preservation",
  "Post-compilation invariants — No new links",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"
diagnostics = []
