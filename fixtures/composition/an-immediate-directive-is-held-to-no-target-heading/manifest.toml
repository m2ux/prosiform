description = "The immediate directive carries the offline title tag. Its target preset redirects the contribution's outgoing directive to the cache. Scope and target heading words supply no selection."

clauses = [
  "Section composition — Presets and subst",
  "Section composition — Deferred composition",
  "Presets — Selection by tags",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "net.md#open"
resolved = "cache.md#open"

[expected.diagnostics.location]
file = "fetch.md"
line = 10
column = 1
