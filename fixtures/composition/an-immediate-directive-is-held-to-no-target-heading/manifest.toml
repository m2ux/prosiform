description = "An immediate directive composes its target in this run, under the presets its step selects, so its step is held to no target heading: Fetch the page offline selects fetch.md's offline preset for the Implementation section, whose own heading selects none, and the contribution is composed with its own directive redirected to the cache by that preset's subst."

clauses = [
  "Section composition — Presets and subst",
  "Section composition — Deferred composition",
  "Presets — Selection by tags",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "net.md#open"
resolved = "cache.md#open"

[expected.diagnostics.location]
file = "fetch.md"
line = 10
column = 1
