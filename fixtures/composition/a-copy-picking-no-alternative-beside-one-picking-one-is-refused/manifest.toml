description = "One section whose link both alternatives of stage.md route is composed once by a directive picking alpha and once by a directive picking none. Each copy resolves under its own directive's presets, so the second has no alternative in force for a link an alternative routes, and the run fails with E_ALTERNATIVE_UNRESOLVED listing the alternatives and publishes nothing."

clauses = [
  "Section composition — Presets and subst",
  "Presets — Exactly one alternative",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_ALTERNATIVE_UNRESOLVED"
source = "stage.md"
message_contains = ["stage.md needs one alternative in force:\n  alpha  The work is of kind alpha.\n  beta   The work is of kind beta."]
