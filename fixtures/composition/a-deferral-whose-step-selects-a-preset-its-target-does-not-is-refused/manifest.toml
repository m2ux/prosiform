description = "The step Fetch the page offline selects fetch.md's offline preset, and the run activating the deferred Implementation selects by that heading, which selects none, so the deferred section would compile otherwise than the step composes it: the run refuses the directive, naming the link and both selections, and publishes no bundle."

clauses = [
  "Section composition — Deferred composition",
  "Section composition — Presets and subst",
  "Presets — Selection by keyword",
  "Presets — A command-line entry reads the file it names",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["fetch.md#implementation", "'Fetch the page offline', which selects 'offline'", "'Implementation', which selects no preset"]
reference = "fetch.md#implementation"
source = "guide.md:8"
chain = ["guide.md", "fetch.md#implementation"]
