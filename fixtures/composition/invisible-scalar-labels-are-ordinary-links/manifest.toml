description = "A label of one whitespace, control or format scalar above U+007F, written or as an entity, shows nothing, so it requests no placement a reader could see and is no composition directive: each is an ordinary link in the preamble, its target bundled and its destination rewritten, and the bundle carries its text as written."

clauses = [
  "Section composition — Recognition",
  "Explicitly linked source structure — Explicit dependencies",
  "Bundle destinations — Internal links",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
