description = "One section is composed twice: once by a directive whose title selects stage.md's task preset, which redirects body.md to task-body.md, and once by a directive selecting none. Each contribution follows its own directive's presets: the tagged copy's link points at the task body and the untagged copy's at the body, both bundled, and the task route raises nothing."

clauses = [
