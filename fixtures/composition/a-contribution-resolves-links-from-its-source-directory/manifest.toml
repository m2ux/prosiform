description = "A guide at the root composes a section of a document in a subdirectory, and the guide and that document each sit beside a notes.md and each carry an Outputs section. The contribution's links resolve from its source's directory: its notes.md is the notes beside it, its ../docs/spec.md is the spec above it, and its #outputs is its own document's Outputs, not the guide's. The guide's own link to notes.md names the notes beside the guide. The guide also links each target document whole, so each keeps its own file group beside its contributions."

clauses = [
  "Section composition — The source of composed content",
  "Section composition — Contributions",
  "Section composition — The directive's link",
  "Section composition — Inline-only targets",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
