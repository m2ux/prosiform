description = "Running the published deferred link as written selects the same cached page and reviewed notes as immediate composition. Its title includes repeated and unmatched names and the headings supply no selection."

clauses = [
  "Section composition — Activation",
  "Section composition — Presets and subst",
  "Presets — A command-line entry selects as a link does",
  "Link entries — A link entry",
]

[invocation]
cwd = "source"
arguments = ["[Material](library/material.md#instructions \" release candidate,CAFÉ,unknown,café \")"]

[expected]
exit_status = 0
bundles = ["expected/library_material__instructions--p-013a885a09022b8f2fe76bef3c9c86751ab9a7e73ec21bb04727f5bf145ccd5c.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
