description = "A composition directive's own title supplies checks. The selected target preset redirects format.md to stub.md inside the contribution and reports that substitution at its source line."

clauses = [
  "Section composition — Presets and subst",
  "Presets — Selection by tags",
  "Presets — What a selection governs",
  "Section composition — The source of composed content",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "format.md#paths"
resolved = "stub.md#paths"

[expected.diagnostics.location]
file = "read.md"
line = 10
column = 1
