description = "An immediate composition selects the matching complete names from its title, including a multiword name and Unicode case, and reads the cached page and reviewed notes under unrelated headings."

clauses = [
  "Section composition — Presets and subst",
  "Presets — Selection by tags",
  "Presets — What a selection governs",
]

[invocation]
cwd = "source"
arguments = ["modes/guide.md"]

[expected]
exit_status = 0
bundles = ["expected/modes_guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "live.md#details"
resolved = "library/cached.md#details"

[expected.diagnostics.location]
file = "library/material.md"
line = 12
column = 1

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "draft.md#details"
resolved = "library/reviewed.md#details"

[expected.diagnostics.location]
file = "library/material.md"
line = 12
column = 1
