description = "One section is composed twice, by directives selecting stage.md's first and second presets, which map body.md to two different substitutes. Each copy resolves under its own directive's presets alone, so the two publish each with its own substitute, and neither route raises a warning."

clauses = [
  "Section composition — Presets and subst",
  "Presets — What a selection governs",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = [
  "expected/guide.bundle.md",
]
diagnostics = []
