description = "The step Fetch the page selects none of fetch.md's presets, and the run activating the deferred Implementation offline selects the offline preset by that heading, so the deferred section would compile otherwise than the step composes it: the run refuses the directive, naming the link and both selections, and publishes no bundle."

clauses = [
  "Section composition — Deferred composition",
  "Section composition — Presets and subst",
  "Presets — Selection by keyword",
  "Presets — A command-line entry reads the file it names",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["fetch.md#implementation-offline", "'Fetch the page', which selects no preset", "'Implementation offline', which selects 'offline'"]
reference = "fetch.md#implementation-offline"
source = "guide.md:8"
chain = ["guide.md", "fetch.md#implementation-offline"]
