description = "A directive selects stage.md's ordinary preset plain and its alternative alpha, which map body.md to one substitute, plain declared first. A pair an ordinary preset states stands in for material under test whichever the document declares first, so the copy's redirect is a stand-in and the run reports it at the section's source line."

clauses = [
  "Section composition — Presets and subst",
  "Presets — Alternatives",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "body.md#body"
resolved = "alpha-body.md#body"

[expected.diagnostics.location]
file = "stage.md"
line = 16
column = 1
