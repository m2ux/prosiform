description = "A document an ordinary link also reaches keeps that inclusion beside its contributions, carrying what the inclusion selects and nothing a directive alone reached: the guide composes the read document's Inputs and links its Outputs, so the read document's file group carries Outputs alone while Inputs stands only in its contribution."

clauses = [
  "Section composition — Inline-only targets",
  "Section composition — Contributions",
  "Adversarial acceptance fixtures — Composition",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
