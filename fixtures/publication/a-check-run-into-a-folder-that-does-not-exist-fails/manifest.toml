description = "A check run told to publish into a folder the fixture does not hold fails as the run without -c does: it returns the publication status, leaves standard output empty and creates no file."

clauses = [
  "Validation and failure contract — Publication",
  "Exit status and JSON diagnostics — 3",
]

[invocation]
cwd = "source"
arguments = ["-c", "-o", "no-such-directory", "guide.md"]

[expected]
exit_status = 3

[[expected.diagnostics]]
severity = "error"
code = "E_PUBLICATION_FAILED"
message_contains = ["no-such-directory"]
