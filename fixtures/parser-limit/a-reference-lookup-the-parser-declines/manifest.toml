description = "A reference whose lookup the parser declines against its own nesting ceiling fails, naming the first source span the parser was reading, rather than publishing a bundle the suppressed lookup left a document out of."

clauses = [
  "Mandatory parser viability gates — Observable reference-resolution suppression",
]

[invocation]
root = "source"
arguments = ["--max-nesting", "1", "guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_PARSER_REFERENCE_LIMIT"
reference = "guide.md"
source = "guide.md:3"
chain = ["guide.md"]
