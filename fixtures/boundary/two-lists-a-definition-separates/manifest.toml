description = "Two lists a link-reference definition separates in the source are two regions, and the blank line the bundle joins them by does not separate two lists that share a marker, so the second would be read as further items of the first and the run refuses the boundary."

clauses = [
  "Block boundaries",
  "Adversarial acceptance fixtures — Boundaries",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_UNSAFE_BUNDLE_BOUNDARY"
reference = "guide.md"
