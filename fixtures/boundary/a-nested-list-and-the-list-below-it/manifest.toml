description = "A region ending inside nested containers is joined to the region below it by a blank line, which closes neither container, so the later region is read as a further item of the outer list and the run refuses the boundary rather than publishing content a reader finds one level in."

clauses = [
  "Block boundaries",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_UNSAFE_BUNDLE_BOUNDARY"
reference = "guide.md"
