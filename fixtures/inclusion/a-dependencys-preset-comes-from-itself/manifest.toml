description = "A linked document is governed by its own default and its own selected presets, never by the linking document's: the title Release Checks selects the Checks preset of guide.md, placing guide.md under Reviews, and the section Checks selects the Checks preset of rules.md, whose pair holds over its default to place rules.md under Checks and never under Reviews."

