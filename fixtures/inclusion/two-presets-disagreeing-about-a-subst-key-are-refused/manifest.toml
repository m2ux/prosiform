description = "Two presets one title selects mapping one subst key to two alternatives disagree: the section Checks and Draft selects the Checks and Draft presets of rules.md, which map steps.md to checked-steps.md and to draft-steps.md, so the run fails with E_INVALID_USAGE naming both presets and the key, and publishes nothing."

clauses = [
  "Presets — Selected presets union",
  "Conversion metadata — subst holds colon pairs",
  "Metadata failures",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["prosiform.Checks.subst and prosiform.Draft.subst", "map 'steps.md' to 'checked-steps.md' and 'draft-steps.md'"]
reference = "rules.md"
chain = ["guide.md", "rules.md"]

[expected.diagnostics.location]
file = "rules.md"
line = 4
column = 13
