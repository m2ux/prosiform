description = "An exclude entry mapping two sections to levels is neither a section name nor a single pair, so it fails with E_INVALID_CONVERSION_METADATA at the entry, naming it, and the run publishes nothing."

clauses = [
  "Conversion metadata — An entry is one string key with an integer value",
  "Metadata failures — E_INVALID_CONVERSION_METADATA",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_CONVERSION_METADATA"
message_contains = ["prosiform.default.exclude[1] must be a section name, or a mapping holding one section and its heading level"]
reference = "guide.md"
chain = ["guide.md"]

[expected.diagnostics.location]
file = "guide.md"
line = 4
column = 24
