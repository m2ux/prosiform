description = "A cited target larger than -B that declares prosiform is captured, so the run fails on the byte budget."

clauses = [
  "Resource limits — -B",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
cwd = "source"
arguments = ["-B", "64", "guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_RESOURCE_LIMIT"
reference = "huge.md"
chain = ["guide.md", "huge.md"]
