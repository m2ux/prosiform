description = "The subst pairs every reference reaching a document selects resolve all of its links: the section Plain bundles rules.md#one under rules.md's default alone and the section Checks bundles rules.md#two under its Checks preset, whose {steps.md: checked-steps.md} redirects the link in One as well, so the bundle carries Checked Steps and never steps.md."

clauses = [
  "Presets — One document under several selections",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "steps.md"
resolved = "checked-steps.md"

[expected.diagnostics.location]
file = "rules.md"
line = 10
column = 1
