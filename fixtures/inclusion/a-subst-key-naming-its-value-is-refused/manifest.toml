description = "A subst entry whose key and value normalise to one identity stands the alternative in for itself: rules.md and ./rules.md name one document, so the run fails with E_INVALID_USAGE at the entry and publishes nothing."

clauses = [
  "Presets — Selected presets union",
  "Conversion metadata — subst holds colon pairs",
  "Metadata failures",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["prosiform.default.subst[0] maps 'rules.md' to './rules.md', which name one identity"]
reference = "guide.md"
chain = ["guide.md"]

[expected.diagnostics.location]
file = "guide.md"
line = 4
column = 13
