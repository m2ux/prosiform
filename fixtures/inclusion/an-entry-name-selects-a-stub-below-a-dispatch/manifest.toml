description = "The entry's title names recorded, which selects the recorded stub of stage.md, a document only the entry's dispatch reaches. The dispatched bundle reads the recorded review its stub's pair names, carries the stub in its preset qualifier, and its pair warns as a stand-in."

clauses = [
  "Presets — Stubs",
  "Presets — Bundle selection identity",
  "Link classification and resource handling — Dispatched bundles",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry.bundle.md", "expected/stage--p-d39dc21d7beb9d3b49138e616dc40270f2e7e38f8c4a1f06201d6e2a6cb1d52e.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "review.md"
resolved = "recorded-review.md"

[expected.diagnostics.location]
file = "stage.md"
line = 11
column = 1
