description = "Two presets one title selects stating pairs that name two groups disagree, because one reference places its document under one pair: the section Checks and Draft selects the Checks and Draft presets of rules.md, which state reviews and drafts, so the run fails with E_INVALID_USAGE naming both presets and both pairs, and publishes nothing."

clauses = [
  "Presets — Selected presets union",
  "Conversion metadata — group holds one pair",
  "Metadata failures",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["prosiform.Checks.group and prosiform.Draft.group", "state {reviews: 1} and {drafts: 1}"]
reference = "rules.md"
chain = ["guide.md", "rules.md"]

[expected.diagnostics.location]
file = "rules.md"
line = 4
column = 13

