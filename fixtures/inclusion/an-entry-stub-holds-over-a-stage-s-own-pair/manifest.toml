description = "The entry's recorded stub and stage.md's default both map review.md, so the stage's link resolves to the entry's substitute and warns W_SUBST_USED as a stand-in, and the stage's own pair, a route its link names, raises nothing."

clauses = [
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry--p-d39dc21d7beb9d3b49138e616dc40270f2e7e38f8c4a1f06201d6e2a6cb1d52e.bundle.md", "expected/stage.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "review.md"
resolved = "recorded-review.md"

[expected.diagnostics.location]
file = "stage.md"
line = 10
column = 1
