description = "The entry's recorded stub redirects the stage's review link to recorded-review.md, whose own link to the live review's Rules section resolves under its own presets, so the stand-in reaches the material it stands in for."

clauses = [
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry--p-d39dc21d.bundle.md", "expected/stage.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "review.md"
resolved = "recorded-review.md"

[expected.diagnostics.location]
file = "stage.md"
line = 8
column = 1
