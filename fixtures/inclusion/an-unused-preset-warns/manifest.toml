description = "The entry declares Draft, and its command supplies no matching --presets name. Draft governs nothing, so the run warns once and publishes."

clauses = [
  "Presets — A preset nothing selected warns",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "guide.md"
message_contains = ["the preset 'Draft'"]
