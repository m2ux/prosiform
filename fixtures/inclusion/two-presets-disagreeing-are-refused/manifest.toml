description = "One link title selects Checks,Draft. Their different depths for the same group conflict, so the run refuses the selection with E_INVALID_USAGE."

clauses = [
  "Presets — Selected presets union",
  "Grouping — Group membership",
  "Metadata failures",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_INVALID_USAGE"
message_contains = ["prosiform.Checks.group and prosiform.Draft.group", "state {reviews: 1} and {reviews: 2}"]
reference = "rules.md"
chain = ["guide.md", "rules.md"]

[expected.diagnostics.location]
file = "rules.md"
line = 4
column = 13
