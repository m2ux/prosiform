description = "The link title epic, mock picks the one alternative of work-kind.md beside its ordinary mock preset. The epic route to epic-body.md raises nothing, while mock's pair, which stands stub.md in for checklist.md, warns W_SUBST_USED at the link it redirected, so a build against stand-ins stays flagged."

clauses = [
  "Presets — Selection by tags",
  "Presets — Selected presets union",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "checklist.md"
resolved = "stub.md"

[expected.diagnostics.location]
file = "work-kind.md"
line = 13
column = 1
