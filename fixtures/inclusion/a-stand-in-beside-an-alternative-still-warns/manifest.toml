description = "The link title epic picks the one alternative of work-kind.md, while the entry's stub mock, which its title selects, stands stub.md in for checklist.md. The epic route to epic-body.md raises nothing, while the stub's pair warns W_SUBST_USED at the link it redirected, so a build against stand-ins stays flagged."

clauses = [
  "Presets — Selection by tags",
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Guide](guide.md \"mock\")"]

[expected]
exit_status = 0
bundles = ["expected/guide-mock.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "checklist.md"
resolved = "stub.md"

[expected.diagnostics.location]
file = "work-kind.md"
line = 11
column = 1
