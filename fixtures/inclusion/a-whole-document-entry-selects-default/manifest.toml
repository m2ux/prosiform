description = "A whole-document entry written as a plain path selects no named preset and applies default. Heading words supply no selection, so its Checks preset remains unused and warns."

clauses = [
  "Presets — A preset nothing selected warns",
  "Presets — A command-line entry selects as a link does",
  "Presets — default always applies",
  "Link entries — A plain path",
  "Grouping — Group membership",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "guide.md"
message_contains = ["the preset 'Checks'"]
