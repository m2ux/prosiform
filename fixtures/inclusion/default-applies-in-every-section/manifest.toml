description = "The default preset applies beneath the title-selected Checks preset. Checks states no group, so default places the document under Modes; its unused substitution pair warns."

clauses = [
  "Presets — default always applies",
  "Presets — Selection by tags",
  "Grouping — Group membership",
  "Grouping — Nested groups",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_UNUSED"
source = "notes.md"
message_contains = ["prosiform.Checks in 'rules.md'"]
