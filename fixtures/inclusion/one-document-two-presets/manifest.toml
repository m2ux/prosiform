description = "One run reaching a document from two sections bundles it under each section's selection: the section Checks puts the Checks preset of rules.md in force and the section Draft its Draft preset, so rules.md joins Reviews and Drafts."

clauses = [
  "Presets — One document under several selections",
  "Presets — Selection by keyword",
  "Presets — A document in several groups",
  "Grouping — Group membership",
  "Grouping — Nested groups",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
