description = "A link naming a declaring document above the invocation working directory is compiled and its destination rewritten: the working directory resolves entry references and the paths diagnostics name, and the target's declaration alone decides whether an authored link is compiled."

clauses = [
  "Link classification and resource handling — Local Markdown document links",
  "Reference normalization and path identity",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
