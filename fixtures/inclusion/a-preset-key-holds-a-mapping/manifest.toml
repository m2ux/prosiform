description = "A target whose prosiform preset holds a mapping declares and enters closure. No incoming title tag selects Target, so the unused preset warns."

clauses = [
  "Presets — A preset nothing selected warns",
  "Conversion metadata — The admitted keys",
  "Link classification and resource handling — Local Markdown document links",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "rules.md"
message_contains = ["the preset 'Target'"]
