description = "A link written by a document whose default preset states subst: [{rules.md: stub.md}] compiles stub.md in place of rules.md, the substitute the pair rules.md=stub.md compiled on the command line, and the run states the substitution it performed."

clauses = [
  "Link classification and resource handling — The substitution mapping",
  "Conversion metadata — subst holds colon pairs",
  "Presets — default always applies",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_SUBST_USED"
source = "rules.md"
resolved = "stub.md"

[expected.diagnostics.location]
file = "guide.md"
line = 10
column = 1
