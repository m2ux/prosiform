description = "The link title epic picks one of work-kind.md's three alternatives and leaves its ordinary checks preset unselected. The unpicked initiative and task alternatives raise no W_PRESET_UNUSED, while checks warns."

clauses = [
  "Presets — Selection by tags",
  "Presets — A preset nothing selected warns",
  "Presets — Alternatives",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "work-kind.md"
message_contains = ["the preset 'checks'"]
