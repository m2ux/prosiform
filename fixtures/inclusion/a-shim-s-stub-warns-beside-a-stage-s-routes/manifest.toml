description = "The shim shims/tally.md declares the stub recorded, which stands stand-ins/source.md in for rules/source.md, and dispatches stages/tally.md under its ordinary preset strict, picking the kind. The stub's pair warns W_SUBST_USED at the stage's link it redirected; the strict route the stage declares raises nothing; and lenient, which no reference of this run selected, warns W_PRESET_UNUSED."

clauses = [
  "Presets — Selection by tags",
  "Presets — Stubs",
  "Link classification and resource handling — The substitution mapping",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["[Tally](shims/tally.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/shims_tally--p-d39dc21d7beb.bundle.md", "expected/stages_tally--p-2829ff28b838.bundle.md", "expected/stages_tally--p-af5ec6f26fe5.bundle.md"]

[[expected.diagnostics]]
