description = "A link with no title selects the Steps section of stage.md, which links body.md, a key both of its alternatives route. The selected section writes a routed link with no alternative in force, so the run fails with E_ALTERNATIVE_UNRESOLVED, listing each alternative beside its choice line."

clauses = [
  "Presets — Exactly one alternative",
  "Metadata failures — E_ALTERNATIVE_UNRESOLVED",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_ALTERNATIVE_UNRESOLVED"
source = "stage.md"
message_contains = ["stage.md needs one alternative in force:\n  alpha  The work is of kind alpha.\n  beta   The work is of kind beta."]
