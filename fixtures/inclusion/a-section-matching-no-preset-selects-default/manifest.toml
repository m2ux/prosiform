description = "A link carrying no matching title tag applies default alone. The target joins Modes, and its unselected Checks preset warns unused."

clauses = [
  "Presets — A preset nothing selected warns",
  "Presets — default always applies",
  "Presets — Selection by tags",
  "Grouping — Group membership",
  "Grouping — Nested groups",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]

[[expected.diagnostics]]
severity = "warning"
code = "W_PRESET_UNUSED"
source = "rules.md"
message_contains = ["the preset 'Checks'"]
