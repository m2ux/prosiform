description = "Marking a reference that names a file outside the profile's Markdown suffixes fails the run, because a mark asks for a bundled document and a resource is carried as its author wrote it."

clauses = [
  "Link classification and resource handling — Everything else",
  "Resources are text",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_MARKED_RESOURCE"
reference = "plan.png"
source = "guide.md:3"
