description = "An entry reference whose parent segments walk above the allowed source root is refused rather than opened, so a document outside the root is never read."

clauses = [
  "Reference normalization and path identity — Resolution sequence, step 7",
  "Reference normalization and path identity — a normalized path outside the root",
]

[invocation]
root = "source"
arguments = ["../outside.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_SOURCE_OUTSIDE_ROOT"
reference = "../outside.md"
