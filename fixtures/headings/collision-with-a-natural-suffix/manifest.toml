description = "A heading whose own text spells an ordinal keeps it, and a heading the renderer numbers apart passes over every ordinal something already carries, so no two headings share a fragment."

clauses = [
  "Source-heading resolution, gitHub-compatible slugs and duplicate tracking",
  "Bundle destinations — Ordinal assignment",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["article.md", "run.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "article"
resolved = "article"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "run"
resolved = "run-4"
