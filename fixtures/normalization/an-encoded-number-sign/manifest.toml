description = "An encoded number sign is a character of a filename, so the reference names a section of the document whose path carries it and the generated file heading shows that character as literal heading text."

clauses = [
  "Resolution sequence — notes%23draft.md#run",
  "Resolution sequence — step 2",
  "File-scoped hierarchy, escape the path as literal heading text",
