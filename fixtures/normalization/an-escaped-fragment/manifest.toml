description = "A fragment written with a percent escape is decoded before it is looked up, so it resolves to the heading whose text the escape spells rather than to no heading at all."

clauses = [
  "Resolution sequence — step 5",
  "Resolution sequence — step 9",
  "Section extraction and output hierarchy",
  "Resolution sequence — step 1, a CLI reference argument entering as a URI-reference string",
]

[invocation]
root = "source"
arguments = ["guide.md#run%2Dit"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Run It"
resolved = "run-it"
