description = "An unencoded number sign opens the fragment, so a reference spelling the path literally names the document before it and fails on the suffix the remainder leaves."

clauses = [
  "Reference normalization and path identity — Resolution sequence, step 2",
  "Markdown and source-heading profile — File suffixes, an explicit entry with another suffix fails",
  "Exit status and JSON diagnostics — 1, input, dependency, policy, safety, or resource-limit failure",
]

[invocation]
root = "source"
arguments = ["notes/draft #.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_ENTRY_SUFFIX"
reference = "notes/draft #.md"
chain = ["notes/draft #.md"]
