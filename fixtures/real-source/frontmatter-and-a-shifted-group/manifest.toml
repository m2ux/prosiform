description = "A workspace skill routing document loses its frontmatter and, its title being one the path does not name, moves every heading down one level, carrying its blockquote, its column-padded tables and the checklist inside its code example unchanged."

clauses = [
  "Input and output contract — Whole documents",
  "Frontmatter policy — steps 1 through 5",
  "File-scoped hierarchy — Group shift",
  "File-scoped hierarchy — Preamble",
  "Markdown and source-heading profile — HTML",
  "Link classification and resource handling — Examples",
  "Parser and source-preserving edits — Untouched content",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["gitnexus-impact-analysis/SKILL.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "gitnexus-impact-analysis/SKILL"
destination = "gitnexus-impact-analysisskill"
