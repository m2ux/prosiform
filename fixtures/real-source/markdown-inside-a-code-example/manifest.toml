description = "A workspace skill document carrying a template inside a four-backtick fence bundles with that example untouched, the H1, the fenced block and the delimiter block inside it counting as no heading, no boundary and no frontmatter, so the document's own title is still the only H1 the file heading absorbs."

clauses = [
  "Input and output contract — Whole documents",
  "Section extraction and output hierarchy — heading-like text in code is not eligible",
  "File-scoped hierarchy — Absorbed title",
  "File-scoped hierarchy — Containers",
  "Frontmatter policy — do not strip YAML examples in code blocks or non-leading thematic breaks",
  "Bundle destinations — Internal links",
  "Parser and source-preserving edits — Untouched content",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["artifacts/architecture-overview.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "artifacts/architecture-overview"
destination = "artifactsarchitecture-overview"
