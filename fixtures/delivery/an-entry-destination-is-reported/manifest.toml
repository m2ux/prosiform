description = "A successful run reports each entry reference and the destination it resolved to on the diagnostic stream, one warning apiece, in the bundle's own order rather than the command line's: the two entries are named in reverse path order and reported in path order, and each pair is the pair the bundle's entry line links."

clauses = [
  "Agent delivery contract — Entry destinations",
  "Agent delivery contract — Clean Markdown",
  "Entry line",
  "Post-compilation invariants — Entry line integrity",
]

[invocation]
root = "source"
arguments = ["notes.md", "guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "guide"
resolved = "guide"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "notes"
resolved = "notes"
