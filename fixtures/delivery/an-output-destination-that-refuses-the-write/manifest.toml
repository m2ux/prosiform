description = "A run told to publish into a directory the fixture does not hold is refused the write, so it returns the publication status, leaves standard output empty and creates no file."

clauses = [
  "Validation and failure contract — Publication",
  "Exit status and JSON diagnostics — exit 3",
]

[invocation]
root = "source"
arguments = ["--output", "no-such-directory/bundle.md", "guide.md"]

[expected]
exit_status = 3
stdout = "expected/stdout.md"
absent = ["no-such-directory/bundle.md"]

[[expected.diagnostics]]
severity = "error"
code = "E_PUBLICATION_FAILED"
