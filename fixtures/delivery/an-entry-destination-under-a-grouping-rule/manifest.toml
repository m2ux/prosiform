description = "The source files declare membership of one merged group, and the run reports the entry references and destinations its bundle's entry line carries. Each entry names a whole document, and each resolves to the subsection naming that member rather than to a file heading."

clauses = [
  "Agent delivery contract — Entry destinations",
  "Grouping — Group structure",
  "Grouping — Document content above the grouping depth",
  "Post-compilation invariants — Entry line integrity",
]

[invocation]
root = "source"
arguments = ["docs/notes.md", "docs/guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Guide"
resolved = "guide"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Notes"
resolved = "notes"
