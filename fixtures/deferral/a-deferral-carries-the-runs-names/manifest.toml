description = "Under an entry naming recorded, a deferral to stage.md titled checks publishes checks, recorded, and an untitled one publishes recorded, so the run bundling either selects the recorded stub again."

clauses = [
  "Presets — A deferral carries the run's names",
  "Presets — Stubs",
]

[invocation]
cwd = "source"
arguments = ["[Entry](entry.md \"recorded\")"]

[expected]
exit_status = 0
bundles = ["expected/entry.bundle.md"]
diagnostics = []
