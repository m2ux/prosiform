description = "A mode in modes/ defers a section of the kind router work-kind.md with the pick token ? as its title. The bundle publishes the link rebased to the working directory with its title as authored, so its command is pf work-kind.md#populate-body --presets '?' from that directory. The first step of a pick, which the router's listing and each pick's bundle follow."

clauses = [
  "Presets — The agent's pick",
  "Link classification and resource handling — The pick token",
  "Link classification and resource handling — A deferred link's destination",
  "Exit status and JSON diagnostics — 0",
]

[invocation]
cwd = "source"
arguments = ["modes/plan.md"]

[expected]
exit_status = 0
bundles = ["expected/modes_plan.bundle.md"]
diagnostics = []
