description = "pf runs on the ? link the mode's bundle publishes, as written and with no --pick. ? matches no preset, so no alternative of the kind router is in force and the run answers with the listing: each alternative beside its choice line, in declaration order, for the agent to pick from, and its remedy is a rerun with --pick. The second step of a pick that waits for the listing."

clauses = [
  "Presets — The agent's pick",
  "Presets — Exactly one alternative",
  "Link entries — A link entry",
  "Metadata failures — E_ALTERNATIVE_UNRESOLVED",
  "Exit status and JSON diagnostics — 2, invalid CLI usage or option combination",
]

[invocation]
cwd = "source"
arguments = ["[Populate the body](work-kind.md#populate-body \"?\")"]

[expected]
exit_status = 2

[[expected.diagnostics]]
severity = "error"
code = "E_ALTERNATIVE_UNRESOLVED"
source = "work-kind.md"
message_contains = ["work-kind.md needs one alternative in force:\n  initiative  States a goal and lists its epics.\n  epic        Lists its tasks in a Work Breakdown table.\n  task        One pull request's worth of work."]
