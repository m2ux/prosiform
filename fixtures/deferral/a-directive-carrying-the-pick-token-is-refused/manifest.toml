description = "A composition directive carries the pick token ?, but this run composes its target section and no agent is left to pick, so the run refuses the link with E_UNSUPPORTED_CONSTRUCT, naming it, and publishes nothing."

clauses = [
  "Link classification and resource handling — The pick token",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_UNSUPPORTED_CONSTRUCT"
message_contains = ["pick token '?'", "no agent is left to pick"]
reference = "↳ Populate"
source = "guide.md:8"
chain = ["guide.md", "work-kind.md#populate"]
