description = "A deferred reference resolving under the allowed source root that names no document fails with E_TARGET_NOT_FOUND and publishes nothing, so a deferral an agent will follow is one that can succeed."

clauses = [
  "Link classification and resource handling — A deferred link's target",
  "Link classification and resource handling — A target that resolves to nothing",
  "Validation and failure contract — Publication",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_TARGET_NOT_FOUND"
reference = "rules.md"
source = "guide.md:3"
chain = ["guide.md", "rules.md"]
