description = "A deferred reference naming no heading of the document it resolves to fails with E_TARGET_NOT_FOUND and publishes nothing, so withholding the compilation withholds nothing of the run's responsibility for the reference."

clauses = [
  "Link classification and resource handling — A deferred link's target",
  "Link classification and resource handling — A target that resolves to nothing",
  "Validation and failure contract — Publication",
]

[invocation]
cwd = "source"
arguments = ["guide.md"]

[expected]
exit_status = 1
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "error"
code = "E_TARGET_NOT_FOUND"
reference = "procedure.md#review"
resolved = "procedure.md"
source = "guide.md:3"
chain = ["guide.md", "procedure.md#review"]
