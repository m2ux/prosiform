description = "A destination is scoped to the whole bundle, so a marked reference from one file group to a section of another is rewritten to the same spelling a reference inside one group takes, in both directions."

clauses = [
  "Bundle destinations — One document",
  "Bundle destinations — Internal links",
  "Bundle destinations — Document destinations",
]

[invocation]
root = "source"
arguments = ["one/guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "one/guide"
destination = "oneguide"
