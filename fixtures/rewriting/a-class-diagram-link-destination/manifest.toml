description = "A class diagram's link line naming a document under the allowed source root compiles that document into the bundle, and the destination between its quotes is rewritten to the destination of that document's heading while every other byte of the fence, the quoted text and target that follow the destination among them, is carried as written."

clauses = [
  "Bundle destinations — Internal links",
  "Bundle destinations — Document destinations",
  "Parser and source-preserving edits — Untouched content",
]

[invocation]
cwd = "source"
arguments = ["model.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"
diagnostics = []
