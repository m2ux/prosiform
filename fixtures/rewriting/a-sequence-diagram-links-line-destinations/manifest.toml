description = "A sequence diagram's links line naming two declaring documents compiles both into the bundle, and each value of its JSON object is rewritten between its own quotes to the destination of its document's heading while every other byte of the line, its labels and punctuation among them, is carried as written."

clauses = [
  "Bundle destinations — Internal links",
  "Bundle destinations — Document destinations",
  "Parser and source-preserving edits — Untouched content",
]

[invocation]
cwd = "source"
arguments = ["--entry", "exchange.md"]

[expected]
exit_status = 0
bundles = ["expected/exchange.bundle.md"]
diagnostics = []
