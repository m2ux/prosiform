description = "A bundle whose every link names a declaring document carries no link naming a source path: a whole-document reference, a section reference and a fragment-only reference are each rewritten to the destination of the target they resolved to."

clauses = [
  "Bundle destinations — Internal links",
  "Bundle destinations — Uniqueness",
  "Post-compilation invariants — One intended destination",
]

[invocation]
cwd = "source"
arguments = ["--entry", "guide.md"]

[expected]
exit_status = 0
bundles = ["expected/guide.bundle.md"]
diagnostics = []
