description = "The usage example that compiles declared groups arranges the artifact documents its closure reaches into one group headed Artifacts, holding one section for each member. Each section is headed by that member's own title, kept as its source text since no other member carries it, and holds that member's own Operations, Fields and Commands subsections, as many of the three as the member has. The reference document joins a second group, headed References, emitting the one heading its member carries at the grouping depth. A whole-document reference to a member resolves to the section its title heads."

clauses = [
  "Usage examples",
  "Grouping — Group membership",
  "Grouping — Group structure",
  "Grouping — Verbatim names",
  "Grouping — Group naming",
  "Grouping — A heading for every member",
]

