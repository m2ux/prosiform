description = "The usage example that merges declared members arranges the closure into two merged groups: each is headed by its declared name in title case, carries an Overview section holding each member's preamble under a subsection named by the run of that document's path that tells it apart from the other members, and emits one heading for each distinct source heading at the grouping depth. A whole-document reference to a member resolves to that member's overview subsection."

clauses = [
  "Usage examples",
  "Grouping — Group membership",
  "Grouping — Group structure",
  "Grouping — Verbatim names",
  "Grouping — Group naming",
  "Grouping — Document content above the grouping depth",
  "Entry line",
]

