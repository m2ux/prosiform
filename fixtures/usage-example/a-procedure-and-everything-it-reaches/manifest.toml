description = "The usage example that compiles the Plan mode dispatches Sync Mode, whose bundle reaches the Delivery Evidence artifact. Sync Mode declares no pair, so the Artifacts group its links place nests inside its division one level deeper, and that artifact's fifth-level headings would be emitted beyond H6: the run fails before publication and publishes no bundle, the Plan mode's own among them."

clauses = [
  "Usage examples",
  "Grouping — Nested groups",
  "File-scoped hierarchy — Depth overflow",
  "Compile before publishing — step 5",
]

[invocation]
cwd = "source"
arguments = ["modes/plan-mode.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_HEADING_DEPTH_OVERFLOW"
reference = "artifacts/delivery-evidence.md"
source = "artifacts/delivery-evidence.md"
chain = ["modes/sync-mode.md", "artifacts/delivery-evidence.md#unnamed-deliveries"]
