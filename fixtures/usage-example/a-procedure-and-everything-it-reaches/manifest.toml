description = "The usage example that names a procedure bundles that procedure and the two documents its prerequisites reach, leaving out the routing document it names in prose rather than links."

clauses = [
  "Usage examples",
  "Input and output contract — Whole documents",
  "Link classification and resource handling — Local Markdown document links under the root",
  "Compile before publishing — step 4",
  "Entry line",
  "Input and output contract — Entry references",
  "Entry line — No execution verb",
  "Entry line — Reading scope at the point of use",
]

[invocation]
cwd = "source"
arguments = ["modes/plan-mode.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Prerequisites"
resolved = "prerequisites"
