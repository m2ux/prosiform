description = "The usage example that names a procedure bundles that procedure and every document its links reach: the Dispatch section of the skill document it follows, under the SKILL heading and that document's title, and the artifact and reference material its links reach. The bundle carries two dispatched links, each keeping its mark and root-relative path, and the two modes they name stay out of the bundle. It carries one deferred link, keeping its root-relative path, and the document it names stays out of the bundle too."

clauses = [
  "Usage examples",
  "Input and output contract — Whole documents",
  "Link classification and resource handling — Local Markdown document links under the root",
  "Compile before publishing — step 4",
  "Entry line",
  "Input and output contract — Entry references",
  "Entry line — No execution verb",
  "Entry line — Reading scope at the point of use",
  "Link classification and resource handling — The deferral mark",
  "Link classification and resource handling — The dispatch operator",
]

