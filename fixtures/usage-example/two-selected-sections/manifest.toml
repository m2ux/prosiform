description = "The usage example that names two sections selects each from the document that carries it, and the reference inside the first carries the second document's section it names."

clauses = [
  "Usage examples",
  "Input and output contract — Sections",
  "Section extraction and output hierarchy — Boundary",
  "Compile before publishing — step 4",
  "Entry line",
]

[invocation]
cwd = "source"
arguments = [
  "artifacts/epic-issue-body.md#record-epic-delivery",
  "artifacts/epic.md#delivery-findings",
]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Record Epic Delivery"
resolved = "record-epic-delivery"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Delivery Findings"
resolved = "delivery-findings"
