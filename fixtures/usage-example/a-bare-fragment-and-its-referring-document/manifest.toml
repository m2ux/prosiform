description = "The usage example that supplies a referring document resolves a fragment-only entry reference against that document and bundles the section it names."

clauses = [
  "CLI contract — Usage examples",
  "CLI contract — --from DOC, the referring document a fragment-only reference resolves against",
  "Input and output contract — Selected sections",
  "Entry line",
]

[invocation]
root = "source"
arguments = ["--from", "artifacts/epic-issue-body.md", "#record-epic-delivery"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "Record Epic Delivery"
resolved = "record-epic-delivery"
