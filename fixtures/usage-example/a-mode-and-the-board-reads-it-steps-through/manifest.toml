description = "The usage example that compiles the Advance mode reaches the Delivery Evidence artifact, whose Run Board Reads steps are fifth-level headings. The mode declares no pair, so the Artifacts group its links place nests inside its division one level deeper, and those steps would be emitted beyond H6: the run fails before publication and publishes no bundle."

clauses = [
  "Usage examples",
  "Grouping — Nested groups",
  "File-scoped hierarchy — Depth overflow",
  "Compile before publishing — step 5",
]

[invocation]
cwd = "source"
arguments = ["modes/advance-mode.md"]

[expected]
exit_status = 1

[[expected.diagnostics]]
severity = "error"
code = "E_HEADING_DEPTH_OVERFLOW"
reference = "artifacts/delivery-evidence.md"
source = "artifacts/delivery-evidence.md"
chain = ["modes/advance-mode.md", "artifacts/delivery-evidence.md#read-board-delivery-evidence"]
