description = "A selection whose source outline skips a level keeps the gap: the structural ancestor above it is emitted at the level the source gave it, shifted by the group's shift, the title the file heading carries is no ancestor, and the level the source never wrote is not filled in."

clauses = [
  "Heading-only structural ancestors — Depth",
  "Post-compilation invariants — Outline preservation",
  "Adversarial acceptance fixtures — Partial outlines, original skipped heading levels",
]

[invocation]
cwd = "source"
arguments = ["notes.md#detail"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"
diagnostics = []
