description = "A section's link to itself resolves to that section's own destination when the whole document is what the run selected, because ownership is stored apart from the region a run consolidated it into."

clauses = [
  "Self-reference and ancestor-reference behavior — Link ownership",
  "Post-compilation invariants — Ownership stability",
]

[invocation]
root = "source"
arguments = ["guide.md"]

[expected]
exit_status = 0
stdout = "expected/stdout.md"

[[expected.diagnostics]]
severity = "warning"
code = "W_ENTRY_DESTINATION"
reference = "guide"
resolved = "guide"
