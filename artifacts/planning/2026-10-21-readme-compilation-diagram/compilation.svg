<title id="title">Compile selected documents and their linked dependencies</title>
<desc id="description">SKILL.md routes to procedure.md and rules.md. Procedure includes tips.md recursively. Rules contains two rule bullets and deferred links ¬ Codex and ¬ Claude to rules/codex.md and rules/claude.md. Both links remain without including their targets. The bundle contains procedure, rules, and tips.</desc>
