<svg xmlns="http://www.w3.org/2000/svg" width="2142" height="1070" viewBox="0 0 2142 1070" role="img" aria-labelledby="title desc"><title id="title">Repeated directory names</title><desc id="desc">One slug groups matching directories in separate branches. Observed output from the pinned compiler.</desc><rect width="2142" height="1070" fill="#0d1117"/><g font-family="IBM Plex Mono" xml:space="preserve"><text x="32" y="48" font-size="29" fill="#e6edf3" font-weight="400">31-repeated-directory-names · Repeated directory names</text><text x="32" y="90" font-size="20" fill="#e3b341" font-weight="400">ACTUAL COMPILER OUTPUT · main 08a8c0317924 · group command review</text><text x="32" y="126" font-size="20" fill="#58a6ff" font-weight="400">prosiform --root sources/31-repeated-directory-names/my-skill --group rules:2 a/rules/blue.md b/rules/red.md</text><text x="32" y="156" font-size="18" fill="#b1c6df" font-weight="400">One slug groups matching directories in separate branches.</text><rect x="32" y="208" width="410" height="351" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
