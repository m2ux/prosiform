<svg xmlns="http://www.w3.org/2000/svg" width="2142" height="908" viewBox="0 0 2142 908" role="img" aria-labelledby="title desc"><title id="title">Unmatched group</title><desc id="desc">An existing directory with no reached members warns while the selected document compiles. Observed output from the pinned compiler.</desc><rect width="2142" height="908" fill="#0d1117"/><g font-family="IBM Plex Mono" xml:space="preserve"><text x="32" y="48" font-size="29" fill="#e6edf3" font-weight="400">32-unmatched-group · Unmatched group</text><text x="32" y="90" font-size="20" fill="#e3b341" font-weight="400">ACTUAL COMPILER OUTPUT · main 08a8c0317924 · group command review</text><text x="32" y="126" font-size="20" fill="#58a6ff" font-weight="400">prosiform --root sources/32-unmatched-group/my-skill --group rules:2 procedure.md</text><text x="32" y="156" font-size="18" fill="#b1c6df" font-weight="400">An existing directory with no reached members warns while the selected document compiles.</text><rect x="32" y="208" width="410" height="240" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
