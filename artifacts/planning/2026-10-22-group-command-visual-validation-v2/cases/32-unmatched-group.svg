<text x="1268" y="319" font-size="20" fill="#58a6ff" font-weight="400">This bundle was built for Procedure; everything else is material</text>
<text x="1268" y="356" font-size="20" fill="#58a6ff" font-weight="400">it references.</text>
<text x="1242" y="416" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1280" y="416" font-size="30" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1268" y="466" font-size="20" fill="#e6edf3" font-weight="400">Run the procedure.</text>
<text x="1268" y="529" font-size="20" fill="#e6edf3" font-weight="400">Diagnostics (stderr):</text>
<text x="1268" y="566" font-size="20" fill="#e6edf3" font-weight="400">W_EMPTY_GROUP_RULE: the grouping rule for &#x27;rules&#x27; arranges</text>
