<svg xmlns="http://www.w3.org/2000/svg" width="2142" height="651" viewBox="0 0 2142 651" role="img" aria-labelledby="title desc"><title id="title">Duplicate Common stems need parent names</title><desc id="desc">Use the shortest distinguishing suffix after the shared prefix: Api Common and Web Common. Proposed output, not compiler evidence.</desc><rect width="2142" height="651" fill="#0d1117"/><g font-family="IBM Plex Mono" xml:space="preserve"><text x="32" y="48" font-size="29" fill="#e6edf3" font-weight="400">17-stem-clash · Duplicate Common stems need parent names</text><text x="32" y="90" font-size="20" fill="#e3b341" font-weight="400">PROPOSED OUTPUT · issues #194 and #195 · not produced by the current compiler</text><text x="32" y="126" font-size="20" fill="#58a6ff" font-weight="400">prosiform --root my-skill --group rules rules/visual/web/common.md rules/visual/api/common.md</text><text x="32" y="156" font-size="18" fill="#b1c6df" font-weight="400">Use the shortest distinguishing suffix after the shared prefix: Api Common and Web Common.</text><text x="32" y="183" font-size="18" fill="#e3b341" font-weight="400">Review note: The existing casing convention capitalizes only the first character of each word: api becomes Api, not API.</text><rect x="32" y="235" width="410" height="351" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
