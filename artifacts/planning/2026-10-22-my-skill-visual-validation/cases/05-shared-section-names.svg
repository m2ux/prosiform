<svg xmlns="http://www.w3.org/2000/svg" width="2142" height="936" viewBox="0 0 2142 936" role="img" aria-labelledby="title desc"><title id="title">Repeated Style sections do not merge</title><desc id="desc">Blue and Red stay whole; neither Style section collects the other member. Proposed output, not compiler evidence.</desc><rect width="2142" height="936" fill="#0d1117"/><g font-family="IBM Plex Mono" xml:space="preserve"><text x="32" y="48" font-size="29" fill="#e6edf3" font-weight="400">05-shared-section-names · Repeated Style sections do not merge</text><text x="32" y="90" font-size="20" fill="#e3b341" font-weight="400">PROPOSED OUTPUT · issues #194 and #195 · not produced by the current compiler</text><text x="32" y="126" font-size="20" fill="#58a6ff" font-weight="400">prosiform --root my-skill --group rules rules/visual/blue.md rules/visual/red.md</text><text x="32" y="156" font-size="18" fill="#b1c6df" font-weight="400">Blue and Red stay whole; neither Style section collects the other member.</text><rect x="32" y="208" width="410" height="277" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
