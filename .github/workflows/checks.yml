# The repository's checks, run on every change that can break what they read
# and reported as not run on every other pull request.
# The job calls the named command a developer calls, so one configuration
# governs a local run and a remote one: `make check` runs the checks in the
# order the Makefile declares, stops at the first failure, and names the
# target that failed.

name: Checks

on:
  # A pull request is where a change is accepted. Its base is a branch that
  # carries the build: main, or an initiative's branch, which targets main.
  # The workspace branch carries the tooling and the engineering branch the
  # planning records; neither holds a build to check. Every such pull request
  # starts the workflow, so the job reports whether its change was checked.
  pull_request:
    branches:
      - main
      - "i[0-9][0-9]/**"
  # The merge commit on main is checked whatever it changed.
  push:
    branches:
      - main
  # A manual trigger runs the eval harness, which the checks leave out.
  workflow_dispatch:
    inputs:
      eval-harness:
        description: Run the diagram-following eval's own harness.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The link and vocabulary checks resolve references into another
          # branch of this repository through git rather than the API, so the
          # checkout carries every branch and the README names which one.
          fetch-depth: 0

      - name: Decide whether the change is checked
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Every path a check reads: the build, the corpus, the checks, the
          # scripts they run, the evals, the documents they read, the Makefile
          # that names them and this workflow. A pull request changing any of
          # them runs the checks; a pull request changing none reports that
          # they did not run. The evals are here because lint, format and type
          # checking still read them, though their own tests run by hand
          # through `make eval-harness` or this workflow's manual trigger.
          CHECKED_PATHS: |
            :(glob)src/**
            :(glob)fixtures/**
            :(glob)checks/**
            :(glob)evals/**
            :(glob)scripts/**
            :(glob)docs/**
            :(glob)**/*.md
            Makefile
            .github/workflows/checks.yml
        run: |
          set -f
          # A push is the merge commit and a dispatch is a revision asked for
          # by hand, so neither is scoped by what it changed.
          if [ "$EVENT" != pull_request ]; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD" -- $CHECKED_PATHS)
          if [ -n "$changed" ]; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          else
            echo "checked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that the checks did not run
        if: steps.scope.outputs.checked != 'true'
        run: |
          message="The checks did not run: this change touches no path they read."
          echo "::notice title=Checks did not run::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        if: steps.scope.outputs.checked == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # The version the planning records document a local run under. The
          # Python toolchain itself comes from src/uv.lock, which
          # `uv run --frozen` installs and resolves nothing beyond.
          version: "0.11.14"

      - name: Run the checks
        if: steps.scope.outputs.checked == 'true'
        run: make check
        env:
          # The link check reads four issues and a user-level project board
          # through the GitHub API, because a private repository answers an
          # unauthenticated request with 404. A user-owned project sits
          # outside the repository scope the built-in token is confined to,
          # so the job supplies a token carrying read:project.
          GH_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
          # The corpus and the documented invocation are both held against a
          # build named here and nowhere else, so the fixtures and the
          # documentation bind an implementation rather than importing one.
          # This change's own build is reached through its console entry
          # point in the locked environment; the runner invokes it from each
          # fixture's directory, so the project is named by absolute path.
          # Unsetting this fails the job rather than passing over the corpus
          # or the documentation, which is what makes a green run a
          # statement.
          PROSIFORM_BUILD: uv run --project ${{ github.workspace }}/src --frozen pf

      # The eval harness is the evaluation's own apparatus rather than the
      # build's contract, so it is never part of `make check`. A manual
      # trigger runs it here, beside the checks, on the revision dispatched.
      - name: Run the eval harness
        if: github.event_name == 'workflow_dispatch' && inputs.eval-harness == 'true'
        run: make eval-harness
