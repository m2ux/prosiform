<text x="70" y="1868" font-size="20" fill="#e6edf3" font-weight="400">2. Push the branch.</text><rect x="32" y="1908" width="1000" height="500" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="1944" font-size="21" fill="#b1c6df" font-weight="400">protocols/tests.md</text>
<path d="M32 1962 H1032" stroke="#303b49"/>
<text x="70" y="2019" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="70" y="2056" font-size="20" fill="#e6edf3" font-weight="400">prosiform:</text>
