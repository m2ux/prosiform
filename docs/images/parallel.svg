<text x="1134" y="116" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/modes_review.bundle.md</text>
<path d="M1110 134 H2110" stroke="#303b49"/>
<text x="1122" y="201" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="201" font-size="30" fill="#e6edf3" font-weight="500">Prosiform</text>
<text x="1122" y="255" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="255" font-size="26" fill="#e6edf3" font-weight="500">Dispatch</text>
<text x="1148" y="303" font-size="20" fill="#e6edf3" font-weight="400">Hand the named bundle to one sub-agent, with the inputs the invoking</text>
<text x="1148" y="340" font-size="20" fill="#e6edf3" font-weight="400">step names, to follow from its start, and continue with the result it</text>
<text x="1148" y="377" font-size="20" fill="#e6edf3" font-weight="400">returns. A dispatched run puts no question to the user: it returns each</text>
<text x="1148" y="414" font-size="20" fill="#e6edf3" font-weight="400">question, with its context paragraph and options, unanswered. The</text>
<text x="1148" y="451" font-size="20" fill="#e6edf3" font-weight="400">dispatching session puts each returned question to the user, or returns</text>
<text x="1148" y="488" font-size="20" fill="#e6edf3" font-weight="400">it in turn when itself dispatched, then dispatches again with the</text>
<text x="1148" y="525" font-size="20" fill="#e6edf3" font-weight="400">answers.</text>
<text x="1122" y="579" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="579" font-size="26" fill="#e6edf3" font-weight="500">Parallel dispatch</text>
<text x="1148" y="627" font-size="20" fill="#e6edf3" font-weight="400">Dispatch every listed bundle at once, each to a sub-agent of its own as</text>
<text x="1148" y="664" font-size="20" fill="#e6edf3" font-weight="400">Dispatch states; an item the invoking step applies &quot;for each&quot; of several</text>
<text x="1148" y="701" font-size="20" fill="#e6edf3" font-weight="400">values is dispatched once per value, together. Continue when every item</text>
<text x="1148" y="738" font-size="20" fill="#e6edf3" font-weight="400">has returned. A failed item cancels nothing: the set returns every</text>
<text x="1148" y="775" font-size="20" fill="#e6edf3" font-weight="400">failure together as blockers. Questions items return are put to the user</text>
<text x="1148" y="812" font-size="20" fill="#e6edf3" font-weight="400">together once every item has returned, and only the items that asked are</text>
<text x="1148" y="849" font-size="20" fill="#58a6ff" font-weight="400">dispatched again.</text>
<text x="1122" y="907" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="907" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="1122" y="961" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="961" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1148" y="1009" font-size="20" fill="#58a6ff" font-weight="400">1. Review Code and Tests together.</text>
<text x="1148" y="1046" font-size="20" fill="#58a6ff" font-weight="400">2. Follow Publish.</text>
<text x="1122" y="1097" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1097" font-size="23" fill="#e6edf3" font-weight="500">Dispatch Publish</text>
<text x="1148" y="1145" font-size="20" fill="#e6edf3" font-weight="400">Dispatch `protocols_publish.bundle.md` to a sub-agent, as Dispatch</text>
<text x="1148" y="1182" font-size="20" fill="#58a6ff" font-weight="400">states.</text>
<text x="1122" y="1233" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1233" font-size="23" fill="#e6edf3" font-weight="500">Dispatch in parallel</text>
<text x="1148" y="1281" font-size="20" fill="#e6edf3" font-weight="400">Dispatch these bundles together, each to a sub-agent, as Parallel</text>
<text x="1148" y="1318" font-size="20" fill="#58a6ff" font-weight="400">dispatch states:</text>
<text x="1148" y="1366" font-size="20" fill="#e6edf3" font-weight="400">• `protocols_code.bundle.md` (Code)</text>
<text x="1148" y="1403" font-size="20" fill="#e6edf3" font-weight="400">• `protocols_tests.bundle.md` (Tests)</text><rect x="1110" y="1443" width="1000" height="278" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="1479" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/protocols_code.bundle.md</text>
