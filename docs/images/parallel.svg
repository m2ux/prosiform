<text x="70" y="1012" font-size="20" fill="#e6edf3" font-weight="400">prosiform:</text>
<text x="70" y="1049" font-size="20" fill="#e6edf3" font-weight="400">  default:</text>
<text x="70" y="1086" font-size="20" fill="#e6edf3" font-weight="400">    group: protocols</text>
<text x="70" y="1123" font-size="20" fill="#e6edf3" font-weight="400">    group-depth: 2</text>
<text x="70" y="1160" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="1207" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="1207" font-size="30" fill="#e6edf3" font-weight="500">Code</text>
<text x="44" y="1261" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
