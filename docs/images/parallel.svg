<text x="82" y="685" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="44" y="739" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="739" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="70" y="787" font-size="20" fill="#e3b341" font-weight="400">1. Review ⫽ Code and ⫽ Tests together.</text>
<text x="70" y="824" font-size="20" fill="#e3b341" font-weight="400">2. Follow ⇉ Publish.</text><rect x="32" y="864" width="1000" height="500" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="900" font-size="21" fill="#b1c6df" font-weight="400">protocols/code.md</text>
