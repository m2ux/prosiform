<text x="70" y="2167" font-size="20" fill="#e6edf3" font-weight="400">    group-depth: 2</text>
<text x="70" y="2204" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="2251" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="2251" font-size="30" fill="#e6edf3" font-weight="500">Tests</text>
<text x="44" y="2305" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="2305" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="70" y="2353" font-size="20" fill="#e6edf3" font-weight="400">1. Run the suite.</text>
<text x="70" y="2390" font-size="20" fill="#e6edf3" font-weight="400">2. Note each failure.</text><rect x="1110" y="80" width="1000" height="1230" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="116" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/modes_review.bundle.md</text>
<path d="M1110 134 H2110" stroke="#303b49"/>
<text x="1122" y="201" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="201" font-size="30" fill="#e6edf3" font-weight="500">Prosiform</text>
<text x="1122" y="255" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="255" font-size="26" fill="#e6edf3" font-weight="500">Dispatch</text>
<text x="1148" y="303" font-size="20" fill="#e6edf3" font-weight="400">Hand the named bundle to one sub-agent with the invoking step&#x27;s inputs,</text>
<text x="1148" y="340" font-size="20" fill="#e6edf3" font-weight="400">to follow from its start, and continue with its result. A dispatched run</text>
<text x="1148" y="377" font-size="20" fill="#e6edf3" font-weight="400">asks nothing: it returns each question, with its context and options,</text>
<text x="1148" y="414" font-size="20" fill="#e6edf3" font-weight="400">unanswered. The dispatching session puts that question to the user, or</text>
<text x="1148" y="451" font-size="20" fill="#e6edf3" font-weight="400">returns it in turn when itself dispatched, then dispatches again with</text>
<text x="1148" y="488" font-size="20" fill="#e6edf3" font-weight="400">the answers.</text>
<text x="1122" y="542" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="542" font-size="26" fill="#e6edf3" font-weight="500">Parallel dispatch</text>
<text x="1148" y="590" font-size="20" fill="#e6edf3" font-weight="400">Dispatch every listed bundle at once, each to a sub-agent of its own per</text>
<text x="1148" y="627" font-size="20" fill="#e6edf3" font-weight="400">dispatch; an item the invoking step applies &quot;for each&quot; of several values</text>
<text x="1148" y="664" font-size="20" fill="#e6edf3" font-weight="400">is dispatched once per value, together. Continue when every item has</text>
<text x="1148" y="701" font-size="20" fill="#e6edf3" font-weight="400">returned; a failed item cancels nothing, and every failure returns</text>
<text x="1148" y="738" font-size="20" fill="#e6edf3" font-weight="400">together as blockers. Questions return together once all items have, and</text>
<text x="1148" y="775" font-size="20" fill="#58a6ff" font-weight="400">only the items that asked are dispatched again.</text>
<text x="1122" y="833" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="833" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="1122" y="887" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="887" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1148" y="935" font-size="20" fill="#58a6ff" font-weight="400">1. Review Code and Tests together.</text>
<text x="1148" y="972" font-size="20" fill="#58a6ff" font-weight="400">2. Follow Publish.</text>
<text x="1122" y="1023" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1023" font-size="23" fill="#e6edf3" font-weight="500">Dispatch Publish</text>
<text x="1148" y="1071" font-size="20" fill="#58a6ff" font-weight="400">Dispatch `protocols_publish.bundle.md` to a sub-agent.</text>
<text x="1122" y="1122" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1122" font-size="23" fill="#e6edf3" font-weight="500">Dispatch in parallel</text>
<text x="1148" y="1170" font-size="20" fill="#e6edf3" font-weight="400">Dispatch these bundles together, each to a sub-agent, per parallel</text>
<text x="1148" y="1207" font-size="20" fill="#58a6ff" font-weight="400">dispatch:</text>
<text x="1148" y="1255" font-size="20" fill="#e6edf3" font-weight="400">• `protocols_code.bundle.md` (Code)</text>
<text x="1148" y="1292" font-size="20" fill="#e6edf3" font-weight="400">• `protocols_tests.bundle.md` (Tests)</text><rect x="1110" y="1332" width="1000" height="278" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="1368" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/protocols_code.bundle.md</text>
