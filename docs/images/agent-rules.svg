<title id="title">Compile the deferred rules for the current agent</title>
<desc id="description">The shared bundle groups Agents beneath Rules, which instructs the agent to compile the deferred Codex or Claude link matching its harness identity. Each compiles its selected document into a bundle headed by its title-cased source path, containing its instruction list.</desc>
