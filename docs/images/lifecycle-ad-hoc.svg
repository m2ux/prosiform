<text x="82" y="2177" font-size="30" fill="#e6edf3" font-weight="500">Waterfall</text>
<text x="44" y="2231" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="2231" font-size="26" fill="#e6edf3" font-weight="500">Plan</text>
<text x="70" y="2279" font-size="20" fill="#e6edf3" font-weight="400">1. Record the requirements, and have them signed off.</text>
<text x="70" y="2316" font-size="20" fill="#e6edf3" font-weight="400">2. Record the design against those requirements, and have it signed off.</text>
<text x="44" y="2370" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="2370" font-size="26" fill="#e6edf3" font-weight="500">Deliver</text>
<text x="70" y="2418" font-size="20" fill="#e6edf3" font-weight="400">1. Implement the signed-off design.</text>
<text x="70" y="2455" font-size="20" fill="#e6edf3" font-weight="400">2. Integrate the work with the system it joins.</text>
<text x="70" y="2492" font-size="20" fill="#e6edf3" font-weight="400">3. Hold any change to requirements or design until it is signed off</text>
<text x="70" y="2529" font-size="20" fill="#e6edf3" font-weight="400">again.</text>
<text x="44" y="2583" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="2583" font-size="26" fill="#e6edf3" font-weight="500">Verify</text>
<text x="70" y="2631" font-size="20" fill="#e6edf3" font-weight="400">1. Run the system tests against the requirements.</text>
<text x="70" y="2668" font-size="20" fill="#e6edf3" font-weight="400">2. Record the stakeholders&#x27; acceptance.</text><rect x="1110" y="80" width="1000" height="542" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
