<text x="82" y="1359" font-size="30" fill="#e6edf3" font-weight="500">SDLC Port</text>
<text x="70" y="1407" font-size="20" fill="#e6edf3" font-weight="400">The hooks a board transition calls. Each places the practice of the SDLC</text>
<text x="70" y="1444" font-size="20" fill="#e6edf3" font-weight="400">its run selected.</text>
<text x="44" y="1498" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1498" font-size="26" fill="#e6edf3" font-weight="500">On Plan</text>
<text x="70" y="1546" font-size="20" fill="#e6edf3" font-weight="400">What a plan holds before it is **Planned**.</text>
<text x="70" y="1594" font-size="20" fill="#58a6ff" font-weight="400">↳ Practice</text>
<text x="44" y="1648" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1648" font-size="26" fill="#e6edf3" font-weight="500">On Deliver</text>
<text x="70" y="1696" font-size="20" fill="#e6edf3" font-weight="400">How work in **In Progress** is built.</text>
<text x="70" y="1744" font-size="20" fill="#58a6ff" font-weight="400">↳ Practice</text>
<text x="44" y="1798" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1798" font-size="26" fill="#e6edf3" font-weight="500">On Verify</text>
<text x="70" y="1846" font-size="20" fill="#e6edf3" font-weight="400">What work in **In Review** shows before it is **Done**.</text>
<text x="70" y="1894" font-size="20" fill="#58a6ff" font-weight="400">↳ Practice</text><rect x="32" y="1934" width="1000" height="752" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="1970" font-size="21" fill="#b1c6df" font-weight="400">sdlc/waterfall.md</text>
