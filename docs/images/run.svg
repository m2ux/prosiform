<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1475" viewBox="0 0 1800 1475" role="img" aria-labelledby="title desc"><title id="title">Linked Markdown compiles into one complete context</title><desc id="desc">SKILL.md selects Review Mode. Its two Rules links reach one Tests section. The compiled bundle contains the source content once, with arrows tracing each link to its heading inside the bundle.</desc><rect width="1800" height="1475" fill="#0d1117"/><g font-family="monospace" xml:space="preserve"><text x="32" y="64" font-size="40" fill="#e6edf3" font-weight="500">Linked Markdown. One complete context.</text>
<text x="32" y="108" font-size="23" fill="#b1c6df" font-weight="400">Resolve the files. Keep the links. Include shared rules once.</text>
<text x="32" y="166" font-size="21" fill="#b1c6df" font-weight="400">01  SELECT AN ENTRY</text>
<text x="530" y="166" font-size="21" fill="#b1c6df" font-weight="400">02  FOLLOW ITS LINKS</text>
<text x="1160" y="166" font-size="21" fill="#b1c6df" font-weight="400">03  ONE VALIDATED BUNDLE</text>
