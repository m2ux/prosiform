<svg xmlns="http://www.w3.org/2000/svg" width="2142" height="1993" viewBox="0 0 2142 1993" role="img" aria-labelledby="title desc"><title id="title">Authored sources and compiled bundles</title><desc id="desc">The files a run read, beside the bundles it wrote.</desc><rect width="2142" height="1993" fill="#0d1117"/><g font-family="IBM Plex Mono" xml:space="preserve"><rect x="32" y="80" width="1000" height="314" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="116" font-size="21" fill="#b1c6df" font-weight="400">Files</text>
<path d="M32 134 H1032" stroke="#303b49"/>
<text x="70" y="191" font-size="20" fill="#e6edf3" font-weight="400">skill/</text>
<text x="70" y="228" font-size="20" fill="#e6edf3" font-weight="400">├─ modes/</text>
<text x="70" y="265" font-size="20" fill="#e6edf3" font-weight="400">│  └─ review.md</text>
<text x="70" y="302" font-size="20" fill="#e6edf3" font-weight="400">├─ protocols/</text>
<text x="70" y="339" font-size="20" fill="#e6edf3" font-weight="400">│  └─ publish.md</text>
<text x="70" y="376" font-size="20" fill="#e6edf3" font-weight="400">└─ rules.md</text><rect x="32" y="416" width="1000" height="539" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="452" font-size="21" fill="#b1c6df" font-weight="400">modes/review.md</text>
<path d="M32 470 H1032" stroke="#303b49"/>
<text x="70" y="527" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="70" y="564" font-size="20" fill="#e6edf3" font-weight="400">prosiform: {}</text>
<text x="70" y="601" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="648" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="648" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="70" y="696" font-size="20" fill="#58a6ff" font-weight="400">Checks a change against the Rules and hands delivery to a sub-agent.</text>
<text x="44" y="750" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="750" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="70" y="798" font-size="20" fill="#58a6ff" font-weight="400">1. Read the Rules.</text>
<text x="70" y="835" font-size="20" fill="#e3b341" font-weight="400">2. Follow ⇉ Publish.</text>
<text x="44" y="889" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="889" font-size="26" fill="#e6edf3" font-weight="500">Notes</text>
<text x="70" y="937" font-size="20" fill="#e6edf3" font-weight="400">A review is not an approval.</text><rect x="32" y="977" width="1000" height="500" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="1013" font-size="21" fill="#b1c6df" font-weight="400">protocols/publish.md</text>
<path d="M32 1031 H1032" stroke="#303b49"/>
<text x="70" y="1088" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="70" y="1125" font-size="20" fill="#e6edf3" font-weight="400">prosiform:</text>
<text x="70" y="1162" font-size="20" fill="#e6edf3" font-weight="400">  default:</text>
<text x="70" y="1199" font-size="20" fill="#e6edf3" font-weight="400">    group: protocols</text>
<text x="70" y="1236" font-size="20" fill="#e6edf3" font-weight="400">    group-depth: 2</text>
<text x="70" y="1273" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="1320" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="1320" font-size="30" fill="#e6edf3" font-weight="500">Publish</text>
<text x="44" y="1374" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1374" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="70" y="1422" font-size="20" fill="#e6edf3" font-weight="400">1. Commit the change.</text>
<text x="70" y="1459" font-size="20" fill="#e6edf3" font-weight="400">2. Push the branch.</text><rect x="32" y="1499" width="1000" height="454" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="1535" font-size="21" fill="#b1c6df" font-weight="400">rules.md</text>
<path d="M32 1553 H1032" stroke="#303b49"/>
<text x="70" y="1610" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="70" y="1647" font-size="20" fill="#e6edf3" font-weight="400">prosiform: {}</text>
<text x="70" y="1684" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="1731" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="1731" font-size="30" fill="#e6edf3" font-weight="500">Rules</text>
<text x="44" y="1785" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1785" font-size="26" fill="#e6edf3" font-weight="500">Tests</text>
<text x="70" y="1833" font-size="20" fill="#e6edf3" font-weight="400">A change lands with a test that fails without it.</text>
<text x="44" y="1887" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1887" font-size="26" fill="#e6edf3" font-weight="500">Reviews</text>
<text x="70" y="1935" font-size="20" fill="#e6edf3" font-weight="400">A change lands reviewed by someone who did not write it.</text><rect x="1110" y="80" width="1000" height="1029" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="116" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/modes_review.bundle.md</text>
<path d="M1110 134 H2110" stroke="#303b49"/>
<text x="1122" y="201" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="201" font-size="30" fill="#e6edf3" font-weight="500">Prosiform</text>
<text x="1122" y="255" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="255" font-size="26" fill="#e6edf3" font-weight="500">Dispatch</text>
<text x="1148" y="303" font-size="20" fill="#e6edf3" font-weight="400">Hand the named bundle to one sub-agent with the invoking step&#x27;s inputs,</text>
<text x="1148" y="340" font-size="20" fill="#e6edf3" font-weight="400">to follow from its start, and continue with its result. A dispatched run</text>
<text x="1148" y="377" font-size="20" fill="#e6edf3" font-weight="400">asks nothing: it returns each question, with its context and options,</text>
<text x="1148" y="414" font-size="20" fill="#e6edf3" font-weight="400">unanswered. The dispatching session puts that question to the user, or</text>
<text x="1148" y="451" font-size="20" fill="#e6edf3" font-weight="400">returns it in turn when itself dispatched, then dispatches again with</text>
<text x="1148" y="488" font-size="20" fill="#e6edf3" font-weight="400">the answers.</text>
<text x="1122" y="546" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="546" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="1148" y="594" font-size="20" fill="#58a6ff" font-weight="400">Checks a change against the Rules and hands delivery to a sub-agent.</text>
<text x="1122" y="648" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="648" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1148" y="696" font-size="20" fill="#58a6ff" font-weight="400">1. Read the Rules.</text>
<text x="1148" y="733" font-size="20" fill="#58a6ff" font-weight="400">2. Follow Publish.</text>
<text x="1122" y="784" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="784" font-size="23" fill="#e6edf3" font-weight="500">Dispatch Publish</text>
<text x="1148" y="832" font-size="20" fill="#58a6ff" font-weight="400">Dispatch `protocols_publish.bundle.md` to a sub-agent.</text>
<text x="1122" y="886" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="886" font-size="26" fill="#e6edf3" font-weight="500">Notes</text>
<text x="1148" y="934" font-size="20" fill="#e6edf3" font-weight="400">A review is not an approval.</text>
<text x="1122" y="992" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="992" font-size="30" fill="#e6edf3" font-weight="500">Rules</text>
<text x="1122" y="1043" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1043" font-size="23" fill="#e6edf3" font-weight="500">Tests</text>
<text x="1148" y="1091" font-size="20" fill="#e6edf3" font-weight="400">A change lands with a test that fails without it.</text><rect x="1110" y="1131" width="1000" height="278" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="1167" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/protocols_publish.bundle.md</text>
<path d="M1110 1185 H2110" stroke="#303b49"/>
<text x="1122" y="1252" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="1252" font-size="30" fill="#e6edf3" font-weight="500">Publish</text>
<text x="1122" y="1306" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="1306" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1148" y="1354" font-size="20" fill="#e6edf3" font-weight="400">1. Commit the change.</text>
