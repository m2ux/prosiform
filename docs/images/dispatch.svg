<text x="70" y="835" font-size="20" fill="#58a6ff" font-weight="400">1. Read the Rules.</text>
<text x="70" y="872" font-size="20" fill="#e3b341" font-weight="400">2. Follow ⇉ Publish.</text>
<text x="44" y="926" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="926" font-size="26" fill="#e6edf3" font-weight="500">Notes</text>
<text x="70" y="974" font-size="20" fill="#e6edf3" font-weight="400">A review is not an approval.</text><rect x="32" y="1014" width="1000" height="463" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="56" y="1050" font-size="21" fill="#b1c6df" font-weight="400">protocols/publish.md</text>
