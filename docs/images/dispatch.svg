<text x="70" y="527" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="70" y="564" font-size="20" fill="#e6edf3" font-weight="400">prosiform:</text>
<text x="70" y="601" font-size="20" fill="#e6edf3" font-weight="400">  root: &quot;..&quot;</text>
<text x="70" y="638" font-size="20" fill="#e6edf3" font-weight="400">---</text>
<text x="44" y="685" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="685" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="70" y="733" font-size="20" fill="#58a6ff" font-weight="400">Checks a change against the Rules and hands delivery to a sub-agent.</text>
<text x="44" y="787" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
