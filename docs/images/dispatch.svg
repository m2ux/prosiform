<text x="44" y="1620" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="82" y="1620" font-size="30" fill="#e6edf3" font-weight="500">Rules</text>
<text x="44" y="1674" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1674" font-size="26" fill="#e6edf3" font-weight="500">Tests</text>
<text x="70" y="1722" font-size="20" fill="#e6edf3" font-weight="400">A change lands with a test that fails without it.</text>
<text x="44" y="1776" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="94" y="1776" font-size="26" fill="#e6edf3" font-weight="500">Reviews</text>
<text x="70" y="1824" font-size="20" fill="#e6edf3" font-weight="400">A change lands reviewed by someone who did not write it.</text><rect x="1110" y="80" width="1000" height="1103" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
<text x="1134" y="116" font-size="21" fill="#b1c6df" font-weight="400">modes_review.bundles/modes_review.bundle.md</text>
<path d="M1110 134 H2110" stroke="#303b49"/>
<text x="1122" y="201" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="201" font-size="30" fill="#e6edf3" font-weight="500">Prosiform</text>
<text x="1122" y="255" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="255" font-size="26" fill="#e6edf3" font-weight="500">Dispatch</text>
<text x="1148" y="303" font-size="20" fill="#e6edf3" font-weight="400">Hand the named bundle to one sub-agent, with the inputs the invoking</text>
<text x="1148" y="340" font-size="20" fill="#e6edf3" font-weight="400">step names, to follow from its start, and continue with the result it</text>
<text x="1148" y="377" font-size="20" fill="#e6edf3" font-weight="400">returns. A dispatched run puts no question to the user: it returns each</text>
<text x="1148" y="414" font-size="20" fill="#e6edf3" font-weight="400">question, with its context paragraph and options, unanswered. The</text>
<text x="1148" y="451" font-size="20" fill="#e6edf3" font-weight="400">dispatching session puts each returned question to the user, or returns</text>
<text x="1148" y="488" font-size="20" fill="#e6edf3" font-weight="400">it in turn when itself dispatched, then dispatches again with the</text>
<text x="1148" y="525" font-size="20" fill="#e6edf3" font-weight="400">answers.</text>
<text x="1122" y="583" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="583" font-size="30" fill="#e6edf3" font-weight="500">Review Mode</text>
<text x="1148" y="631" font-size="20" fill="#58a6ff" font-weight="400">Checks a change against the Rules and hands delivery to a sub-agent.</text>
<text x="1122" y="685" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="685" font-size="26" fill="#e6edf3" font-weight="500">Procedure</text>
<text x="1148" y="733" font-size="20" fill="#58a6ff" font-weight="400">1. Read the Rules.</text>
<text x="1148" y="770" font-size="20" fill="#58a6ff" font-weight="400">2. Follow Publish.</text>
<text x="1122" y="821" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="821" font-size="23" fill="#e6edf3" font-weight="500">Dispatch Publish</text>
<text x="1148" y="869" font-size="20" fill="#e6edf3" font-weight="400">Dispatch `protocols_publish.bundle.md` to a sub-agent, as Dispatch</text>
<text x="1148" y="906" font-size="20" fill="#58a6ff" font-weight="400">states.</text>
<text x="1122" y="960" font-size="11" fill="#b1c6df" font-weight="400">H2</text>
<text x="1172" y="960" font-size="26" fill="#e6edf3" font-weight="500">Notes</text>
<text x="1148" y="1008" font-size="20" fill="#e6edf3" font-weight="400">A review is not an approval.</text>
<text x="1122" y="1066" font-size="11" fill="#b1c6df" font-weight="400">H1</text>
<text x="1160" y="1066" font-size="30" fill="#e6edf3" font-weight="500">Rules</text>
<text x="1122" y="1117" font-size="11" fill="#b1c6df" font-weight="400">H3</text>
<text x="1184" y="1117" font-size="23" fill="#e6edf3" font-weight="500">Tests</text>
<text x="1148" y="1165" font-size="20" fill="#e6edf3" font-weight="400">A change lands with a test that fails without it.</text><rect x="1110" y="1205" width="1000" height="278" rx="12" fill="#161b22" stroke="#303b49" stroke-width="2"/>
