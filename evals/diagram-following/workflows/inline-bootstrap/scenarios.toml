# A scenario is the inputs a run is given, the path a correct run walks and the
# pf runs it makes. Each input is a file under inputs/ holding the value
# written, then a newline. The skill's SKILL.md declares no prosiform and holds
# one hand-written line naming the workflow to compile, so a compile entry
# names, from the skill's directory, bare pf for the guide the skill says to
# run, then the document that line names.

[[scenario]]
name = "feature-tagged"
path = ["Freeze", "Tag", "Broadcast"]
inputs = { "change.txt" = "feature" }

[[scenario.compile]]
args = []

[[scenario.compile]]
args = ["sources/workflow.md"]

[[scenario]]
name = "fix-backported"
path = ["Freeze", "Backport", "Broadcast"]
inputs = { "change.txt" = "fix" }

[[scenario.compile]]
args = []

[[scenario.compile]]
args = ["sources/workflow.md"]
