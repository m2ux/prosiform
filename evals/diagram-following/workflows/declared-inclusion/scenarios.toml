# A scenario is the inputs a run is given and the path a correct run walks.
# Each input is a file under inputs/ holding the value written, then a newline.

[[scenario]]
name = "declared-link-followed"
path = [
    "Entry",
    "Receive",
    "Inspect",
    "Verify",
    "Archive",
    "Exit",
]
inputs = { "supplier.txt" = "internal" }

[[scenario]]
name = "undeclared-link-as-text"
path = [
    "Entry",
    "Receive",
    "Liaise",
    "Archive",
    "Exit",
]
inputs = { "supplier.txt" = "vendor" }
