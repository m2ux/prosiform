# A scenario is the inputs a run is given and the path a correct run walks.
# Each input is a file under inputs/ holding the value written, then a newline.
#
# Gauge composes Convert's section beneath a step that holds where scope.txt
# reads large, so the bundle carries Convert whatever the input, and the path
# enters it only where the step holds.

[[scenario]]
name = "composed-entered"
path = ["Entry", "Sample", "Gauge", "Convert", "Finish", "Exit"]
inputs = { "scope.txt" = "large" }

[[scenario]]
name = "composed-omitted"
path = ["Entry", "Sample", "Gauge", "Finish", "Exit"]
inputs = { "scope.txt" = "small" }
