# A scenario is the inputs a run is given, the path a correct run walks, and the
# sub-agents a correct run starts. Each input is a file under inputs/ holding
# the value written, then a newline. A trace entry names the section a
# sub-agent follows, in the order the walk dispatches it, what it returned, and
# whether it started beside the entry above it.
#
# Each chain runs three hops below the session, the depth pf publishes with no
# W_DISPATCH_DEPTH. A sub-agent's own dispatch starts before it returns, so
# each hop is listed after the one that started it and returns before its
# caller continues.

[[scenario]]
name = "three-hop-chain"
path = ["Brief", "Route", "Relay", "Wrap"]
inputs = { "shape.txt" = "line" }

[[scenario.trace]]
dispatch = "line/scope#frame"
returned = "done"

[[scenario.trace]]
dispatch = "line/detail#expand"
returned = "done"

[[scenario.trace]]
dispatch = "line/tally#count"
returned = "done"

# The division's first step starts the east and west halves as one set at the
# second hop; both return before its second step starts the join, which
# starts the seal at the third.

[[scenario]]
name = "three-hop-set"
path = ["Brief", "Fan", "Wrap"]
inputs = { "shape.txt" = "set" }

[[scenario.trace]]
dispatch = "fan/divide#portion"
returned = "done"

[[scenario.trace]]
dispatch = "fan/east#east"
returned = "done"

[[scenario.trace]]
dispatch = "fan/west#west"
returned = "done"
together = true

[[scenario.trace]]
dispatch = "fan/join#join"
returned = "done"

[[scenario.trace]]
dispatch = "fan/seal#seal"
returned = "done"

# The election, three hops down, returns its question; the probe and the
# enquiry each return it in turn, so the session puts it to the user. Resume
# dispatches the enquiry again with the answers, and the chain runs down to
# the election once more, which returns done.

[[scenario]]
name = "three-hop-question"
path = ["Brief", "Route", "Query", "Resume", "Wrap"]
inputs = { "shape.txt" = "question" }

[[scenario.trace]]
dispatch = "ask/enquiry#pose"
returned = "question"

[[scenario.trace]]
dispatch = "ask/probe#probe"
returned = "question"

[[scenario.trace]]
dispatch = "ask/choice#elect"
returned = "question"

[[scenario.trace]]
dispatch = "ask/enquiry#pose"
returned = "done"

[[scenario.trace]]
dispatch = "ask/probe#probe"
returned = "done"

[[scenario.trace]]
dispatch = "ask/choice#elect"
returned = "done"
