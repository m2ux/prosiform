# A scenario is the inputs a run is given, the path a correct run walks, the
# sub-agents a correct run starts and the pf runs it makes. Each input is a file
# under inputs/ holding the value written, then a newline. A trace entry names
# the section a sub-agent follows, in the order the walk dispatches it, what it
# returned, and whether it started beside the entry above it. A compile entry
# names the references one pf run compiles, from the skill's directory, in the
# order the session makes them: bare pf for the guide the skill says to run,
# then the workflow its link names.

[[scenario]]
name = "blocking-two-halves"
path = ["Scope", "Gather", "Weigh", "Record", "Fix", "Publish"]
inputs = { "halves.txt" = "two", "severity.txt" = "blocking", "known.txt" = "no", "fatal.txt" = "yes" }

[[scenario.trace]]
dispatch = "review#source"
returned = "done"

[[scenario.trace]]
dispatch = "review#tests"
returned = "done"
together = true

[[scenario.trace]]
dispatch = "review#appraise"
returned = "done"

[[scenario.trace]]
dispatch = "review#repair"
returned = "done"

[[scenario.compile]]
args = []

[[scenario.compile]]
args = ["sources/workflow.md"]

[[scenario]]
name = "clean-one-half"
path = ["Scope", "Gather", "Weigh", "Record", "Publish"]
inputs = { "halves.txt" = "one", "severity.txt" = "clean", "known.txt" = "yes", "fatal.txt" = "no" }

[[scenario.trace]]
dispatch = "review#source"
returned = "done"

[[scenario.trace]]
dispatch = "review#tests"
returned = "done"
together = true

[[scenario.trace]]
dispatch = "review#appraise"
returned = "done"

[[scenario.compile]]
args = []

[[scenario.compile]]
args = ["sources/workflow.md"]
