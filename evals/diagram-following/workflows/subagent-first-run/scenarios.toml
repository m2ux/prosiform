# A scenario is the inputs a run is given, the path a correct run walks, and the
# sub-agents a correct run starts. Each input is a file under inputs/ holding
# the value written, then a newline. A trace entry names the section a
# sub-agent follows, in the order the walk dispatches it, what it returned,
# and the actions it does: each a file under actions/ and the value it holds.
#
# A dispatched bundle carrying a deferred line opens with the Prosiform
# section saying pf runs first, and only the material pf compiles on that line
# states the sub-agent's action. A sub-agent's own pf runs are read from no
# harness's stream, so its run is shown by the action that run's material
# states rather than stated as a run of its own.

[[scenario]]
name = "first-hop-run"
path = ["Allot", "Entrust", "Tidy"]
inputs = { "reach.txt" = "near" }

[[scenario.trace]]
dispatch = "hop/ledger#balance"
returned = "done"
actions = { "closing.txt" = "closed" }

# The review, at the second hop, compiles the weighing rules its deferred
# dispatch names; their bundle states its action and dispatches the ruling,
# whose bundle, at the third hop, carries a line its own run compiles.

[[scenario]]
name = "deep-hop-runs"
path = ["Allot", "Cascade", "Tidy"]
inputs = { "reach.txt" = "deep" }

[[scenario.trace]]
dispatch = "hop/audit#sweep"
returned = "done"

[[scenario.trace]]
dispatch = "hop/review#scan"
returned = "done"
actions = { "weighing.txt" = "weighed" }

[[scenario.trace]]
dispatch = "steps/ruling#rule"
returned = "done"
actions = { "ruling.txt" = "ruled" }
