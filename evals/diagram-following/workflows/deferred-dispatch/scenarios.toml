# A scenario is the inputs a run is given, the path a correct run walks, the
# sub-agents it starts and the pf runs it makes. Each input is a file under
# inputs/ holding the value written, then a newline. A trace entry names the
# section a sub-agent follows, in the order the walk dispatches it, and what it
# returned. A compile entry names the reference one pf run compiles, from the
# workspace, in the order the session makes them.
#
# Pack defers the loading crew's section, which dispatches, under a step that
# holds where order.txt reads bulk, and pf publishes it as a line beneath that
# step. The run on that line writes a bundle dispatching the lift, then the
# strap, so the sub-agents a correct run starts are the ones that run's bundle
# dispatches.

[[scenario]]
name = "deferred-dispatch-compiled"
path = ["Entry", "Pick", "Pack", "Post", "Exit"]
inputs = { "order.txt" = "bulk" }

[[scenario.trace]]
dispatch = "reference/crew#work"
presets = "lift"
action = { file = "lift.txt", value = "lifted" }

[[scenario.trace]]
dispatch = "reference/crew#work"
presets = "strap"
action = { file = "strap.txt", value = "strapped" }

[[scenario.compile]]
entry = "reference/loading.md#crew"

[[scenario]]
name = "deferred-dispatch-passed"
path = ["Entry", "Pick", "Pack", "Post", "Exit"]
inputs = { "order.txt" = "single" }
