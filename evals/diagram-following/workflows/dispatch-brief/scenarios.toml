# A scenario is the inputs a run is given, the path a correct run walks, and the
# sub-agents a correct run starts. Each input is a file under inputs/ holding
# the value written, then a newline. A trace entry names the section a
# sub-agent follows, the brief its dispatching agent acts on before starting
# it, as the action file and value the target's Given section states, and the
# action file and value the sub-agent's section states. The section has the
# sub-agent copy the brief's file, so its action holds the brief's value only
# where the brief was acted on before the start.
#
# The briefed form declares each target's Given section as its brief; the
# compiled form composes it with a ↳ line beside the dispatch.

[[scenario]]
name = "ledger-brief"
path = ["Entry", "Receive", "Trace", "Exit"]
inputs = { "case.txt" = "ledger" }

[[scenario.trace]]
dispatch = "ledger#check"
brief = { file = "given.txt", value = "ledger-7" }
action = { file = "finding.txt", value = "ledger-7" }

[[scenario]]
name = "payroll-brief"
path = ["Entry", "Receive", "Audit", "Exit"]
inputs = { "case.txt" = "payroll" }

[[scenario.trace]]
dispatch = "payroll#check"
