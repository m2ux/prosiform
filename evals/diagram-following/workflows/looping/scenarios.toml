# A scenario is the inputs a run is given and the path a correct run walks.
# Each input is a file under inputs/ holding the value written, then a newline.

[[scenario]]
name = "no-rework"
path = [
    "Entry",
    "Draft",
    "Review",
    "Publish",
    "Exit",
]
inputs = { "rounds.txt" = "0" }

[[scenario]]
name = "two-rounds"
path = [
    "Entry",
    "Draft",
    "Review",
    "Revise",
    "Check",
    "Review",
    "Revise",
    "Check",
    "Review",
    "Publish",
    "Exit",
]
inputs = { "rounds.txt" = "2" }
